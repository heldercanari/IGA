<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablets · IGA</title>
    <link rel="icon" type="image/png" href="/iga/favicon.png">
    <!-- Sem `defer`: o Tailwind v4 em browser compila as classes em JS e só as
         aplica quando corre. Adiado para depois do parse, o browser chega a pintar
         a página em cru. O ficheiro é local, não vem de CDN nenhum. O lucide fica
         adiado — é só ícones, e o script de baixo já espera por ele. -->
    <script src="/iga/tailwind.global.js"></script>
    <script src="/iga/lucide.min.js" defer></script>
    <style>
        /* `hidden` é uma classe do Tailwind, portanto só existe depois de ele
           compilar. Declará-la aqui garante que os modais e o toast não aparecem
           empilhados na fracção de segundo anterior. */
        .hidden { display: none; }

        body, input, select, textarea, button {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        thead.pegajoso th { position: sticky; top: 0; z-index: 10; }
        tbody tr { line-height: 1.3; }
        .accao {
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 6px; border: none;
            background: transparent; cursor: pointer; flex-shrink: 0;
            transition: background-color .15s, transform .1s;
        }
        .accao:hover { transform: scale(1.12); }
        .accao:disabled { opacity: .25; cursor: not-allowed; transform: none; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important; animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<script>
'use strict';

const API = '/api/iga/tablets';   // as rotas deste ecrã
const API_MODULO = '/api/iga';       // /permissoes é do módulo, não do tipo

const estado = {
  permissoes: null,
  tablets: [],
  filtros: { q: '', estado: '', local: '' },
  aberto: null,
};

// ─── Utilitários ───────────────────────────────────────────

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/**
 * Datas em dd/mm/aaaa, lidas em UTC.
 *
 * A base guarda DATE e o SQL Server devolve-a como meia-noite UTC. Ler as
 * componentes locais fazia a data recuar um dia em qualquer fuso a oeste de
 * Lisboa — e a intranet é consultada de casa.
 */
function dataPt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return esc(v);
  return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`;
}

function hojeISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

let toastTimer = null;
function toast(msg, tipo) {
  const el = document.getElementById('toast');
  const cor = tipo === 'erro' ? 'bg-red-600' : tipo === 'aviso' ? 'bg-amber-600' : 'bg-emerald-600';
  el.className = `fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl text-sm font-semibold text-white ${cor}`;
  document.getElementById('toastIcone').innerHTML =
    `<i data-lucide="${tipo === 'erro' ? 'alert-circle' : tipo === 'aviso' ? 'alert-triangle' : 'check-circle'}" class="w-5 h-5"></i>`;
  document.getElementById('toastMsg').textContent = msg;
  if (window.lucide) lucide.createIcons();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 4000);
}

async function pedir(caminho, opcoes, base) {
  const r = await fetch((base || API) + caminho, Object.assign({ headers: { 'Accept': 'application/json' } }, opcoes));
  let corpo = null;
  try { corpo = await r.json(); } catch (e) { /* resposta sem JSON */ }
  if (!r.ok) throw new Error((corpo && corpo.error) || `Erro ${r.status}`);
  return corpo;
}

function enviar(caminho, dados, metodo) {
  return pedir(caminho, {
    method: metodo || 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(dados || {}),
  });
}

const ESTADOS = {
  atribuido:  { texto: 'Entregue',   classe: 'bg-blue-100 text-blue-800' },
  disponivel: { texto: 'Disponível', classe: 'bg-emerald-100 text-emerald-800' },
  avariado:   { texto: 'Avariado',   classe: 'bg-amber-100 text-amber-800' },
  abatido:    { texto: 'Abatido',    classe: 'bg-slate-200 text-slate-700' },
};

function etiqueta(chave) {
  const e = ESTADOS[chave] || { texto: chave || '—', classe: 'bg-slate-100 text-slate-600' };
  return `<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full ${e.classe}">${esc(e.texto)}</span>`;
}

function linhaCampo(rotulo, valor) {
  return `<div>
    <dt class="text-[11px] uppercase tracking-wide text-slate-600 font-semibold">${esc(rotulo)}</dt>
    <dd class="text-sm text-slate-800">${valor || '<span class="text-slate-300">—</span>'}</dd>
  </div>`;
}

/**
 * Como se chama um tablet: o número de inventário, quando o tem.
 *
 * Só a folha da Div Pol trazia inventário ("29/TAB/2023"); os da Divisão de
 * Trânsito e da Segurança Privada não, e para esses o que os distingue é o
 * número do cartão.
 */
function nomeDoTablet(t) {
  return t.num_inventario || (t.numero ? `cartão ${t.numero}` : (t.num_serie || 'sem identificação'));
}

/** A célula do equipamento na tabela: o inventário a negrito, ou o cartão com a ressalva. */
function identificacao(t) {
  if (t.num_inventario) return `<span class="font-bold text-slate-900">${esc(t.num_inventario)}</span>`;
  if (t.numero) return `<span class="font-bold text-slate-900">${esc(t.numero)}</span>
    <span class="text-[11px] text-slate-500">· sem inventário</span>`;
  return `<span class="text-slate-500">${esc(t.num_serie || 'sem identificação')}</span>`;
}

// ─── Listagem ──────────────────────────────────────────────

async function carregar() {
  const p = new URLSearchParams();
  if (estado.filtros.q) p.set('q', estado.filtros.q);
  if (estado.filtros.estado) p.set('estado', estado.filtros.estado);
  if (estado.filtros.local) p.set('local', estado.filtros.local);
  estado.tablets = await pedir('/?' + p.toString());
  desenhar();
}

function desenhar() {
  const podeEditar = estado.permissoes && estado.permissoes.canEdit;
  const podeAdmin = estado.permissoes && estado.permissoes.canAdmin;
  const corpo = document.getElementById('tabela');

  if (!estado.tablets.length) {
    corpo.innerHTML = `<tr><td colspan="6" class="px-4 py-10 text-center text-slate-600 text-sm">
      Nenhum tablet encontrado com estes filtros.</td></tr>`;
    document.getElementById('rodape').textContent = '';
    return;
  }

  // Agrupada por divisão: os tablets pertencem a uma (Div Pol, Divisão de
  // Trânsito, Segurança Privada) e é por ela que se distribuem. A API já os
  // devolve ordenados pela divisão, portanto cada grupo é uma fila seguida, e o
  // cabeçalho do grupo entra sempre que a divisão muda.
  const porDivisao = new Map();
  for (const t of estado.tablets) {
    const k = t.localizacao || '';
    if (!porDivisao.has(k)) porDivisao.set(k, []);
    porDivisao.get(k).push(t);
  }
  const cabecalho = (divisao, lista) => {
    const partes = [`${lista.length} ${lista.length === 1 ? 'tablet' : 'tablets'}`];
    for (const [e, um, varios] of [['atribuido', 'entregue', 'entregues'], ['disponivel', 'disponível', 'disponíveis'],
                                   ['avariado', 'avariado', 'avariados'], ['abatido', 'abatido', 'abatidos']]) {
      const n = lista.filter(t => t.estado === e).length;
      if (n) partes.push(`${n} ${n === 1 ? um : varios}`);
    }
    return `<tr class="bg-slate-50">
      <th colspan="5" scope="rowgroup" class="text-left px-3 py-2 border-t border-slate-200">
        <span class="text-sm font-extrabold text-slate-900">${divisao ? esc(divisao) : 'Sem divisão'}</span>
        <span class="ml-2 text-xs font-normal text-slate-500">${partes.join(' · ')}</span>
      </th>
    </tr>`;
  };

  corpo.innerHTML = [...porDivisao].map(([divisao, lista]) => cabecalho(divisao, lista) + lista.map(t => {
    const entregue = t.matricula || t.nome_utilizador
      ? `${esc(t.nome_utilizador || '—')}${t.matricula ? ` <span class="text-slate-600">· ${esc(t.matricula)}</span>` : ''}`
      : '<span class="text-slate-300">—</span>';
    // A tabela é o que se quer ver à primeira: que tablet é e quem o tem. O
    // resto — série, IMEI, ICCID, PIN, PUK, marca e modelo — está na ficha.
    // A linha inteira abre a ficha — não há botão de olho. Os botões de acção
    // ficam por cima: o `closest()` do clique encontra-os antes da linha.
    return `<tr class="hover:bg-blue-50 cursor-pointer focus:outline-none focus:bg-blue-50" data-detalhe="${t.id}"
              tabindex="0" aria-label="Ver detalhe do tablet ${esc(nomeDoTablet(t))}">
      <td class="px-3 py-2">${identificacao(t)}</td>
      <td class="px-3 py-2">${entregue}</td>
      <td class="px-3 py-2 text-slate-600 whitespace-nowrap">${t.data_entrega ? dataPt(t.data_entrega) : '<span class="text-slate-300">—</span>'}</td>
      <td class="px-3 py-2">${etiqueta(t.estado)}${etiquetaAbate(t.abate_estado === 'proposto' ? 'proposto' : '')}</td>
      <td class="px-3 py-2 text-right whitespace-nowrap">
        <button class="accao text-blue-600 hover:bg-blue-50" data-entregar="${t.id}" title="Entregar" ${podeEditar && t.estado !== 'abatido' && !t.abate_estado ? '' : 'disabled'}>
          <i data-lucide="user-plus" class="w-4 h-4"></i></button>
        <button class="accao text-emerald-600 hover:bg-emerald-50" data-devolver="${t.id}" title="Devolver" ${podeEditar && t.atribuicao_id ? '' : 'disabled'}>
          <i data-lucide="undo-2" class="w-4 h-4"></i></button>
        <button class="accao text-amber-600 hover:bg-amber-50" data-avaria="${t.id}" title="Registar avaria" ${podeEditar && t.estado !== 'abatido' ? '' : 'disabled'}>
          <i data-lucide="wrench" class="w-4 h-4"></i></button>
        <button class="accao text-slate-600 hover:bg-slate-100" data-propor="${t.id}" title="Propor para abate" ${podeEditar && !t.abate_estado ? '' : 'disabled'}>
          <i data-lucide="archive" class="w-4 h-4"></i></button>
      </td>
    </tr>`;
  }).join('')).join('');

  document.getElementById('rodape').textContent =
    `${estado.tablets.length} ${estado.tablets.length === 1 ? 'tablet' : 'tablets'}` +
    (porDivisao.size > 1 ? ` em ${porDivisao.size} divisões` : '') +
    (estado.filtros.q || estado.filtros.estado || estado.filtros.local ? ' (filtrado)' : '');
  if (window.lucide) lucide.createIcons();
}

/** Enche o filtro das divisões com as que existem, sem perder a escolhida. */
async function carregarDivisoes() {
  const locais = await pedir('/locais');
  const sel = document.getElementById('filtroDivisao');
  sel.innerHTML = '<option value="">Todas</option>' + locais.map(l =>
    `<option value="${esc(l.localizacao)}">${esc(l.localizacao)} (${l.total})</option>`).join('');
  sel.value = estado.filtros.local;
}

async function carregarEstatisticas() {
  const e = await pedir('/estatisticas');
  document.getElementById('kpiTotal').textContent = e.total;
  document.getElementById('kpiAtribuidos').textContent = e.atribuidos;
  document.getElementById('kpiDisponiveis').textContent = e.disponiveis;
  document.getElementById('kpiAvariados').textContent = e.avariados;
  document.getElementById('kpiAbatidos').textContent = e.abatidos;

/**
 * CSV com ponto e vírgula e BOM: é o que o Excel em português abre sem pedir
 * nada. Com vírgula, o Excel PT junta tudo numa coluna só.
 *
 * Sem PIN nem PUK: a listagem que alimenta isto não os traz. Estão na ficha, à
 * vista de quem a abre, mas levá-los num ficheiro é outra decisão.
 */
function exportarCSV() {
  const colunas = ['num_inventario', 'numero', 'imei', 'num_serie', 'iccid', 'marca', 'modelo',
                   'finalidade', 'estado', 'localizacao', 'matricula', 'nome_utilizador',
                   'data_entrega', 'avaria_descricao', 'obs'];
  const celula = v => {
    if (v === null || v === undefined) return '';
    const s = String(v).replace(/"/g, '""');
    return /[";\n]/.test(s) ? `"${s}"` : s;
  };
  const linhas = [colunas.join(';')].concat(estado.tablets.map(t =>
    colunas.map(c => celula(c === 'data_entrega' && t[c] ? dataPt(t[c]) : t[c])).join(';')));
  const url = URL.createObjectURL(new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `tablets_${hojeISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

let temporizadorProcura = null;
function procuraAdiada(fn) {
  clearTimeout(temporizadorProcura);
  temporizadorProcura = setTimeout(fn, 250);
}

document.addEventListener('click', async ev => {
  const alvo = ev.target.closest('[data-detalhe],[data-entregar],[data-devolver],[data-avaria],[data-reparar],[data-estado],[data-fechar],[data-fechar-modal],#btnEditar,#btnNovo,#btnExportar');
  if (!alvo) return;
  const d = alvo.dataset;
  try {
    if (alvo.matches('[data-fechar]')) return fecharPainel();
    if (alvo.matches('[data-fechar-modal]')) return fecharModal();
    if (alvo.id === 'btnExportar') return exportarCSV();
    if (alvo.id === 'btnNovo') return modalEquipamento(null);
    if (alvo.id === 'btnEditar') return modalEquipamento(estado.aberto);
    if (d.detalhe) return abrirDetalhe(Number(d.detalhe));
    if (d.entregar) return modalEntregar(Number(d.entregar));
    if (d.devolver) return modalDevolver(Number(d.devolver));
    if (d.avaria) return modalAvaria(Number(d.avaria));
    if (d.reparar) return modalReparar(Number(d.reparar));
    if (d.estado !== undefined && alvo.classList.contains('cartao')) {
      estado.filtros.estado = d.estado;
      document.getElementById('filtroEstado').value = d.estado;
      return carregar();
    }
  } catch (err) {
    toast(err.message, 'erro');
  }
});

document.getElementById('modalForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!submeterModal) return;
  const botao = document.getElementById('modalGravar');
  botao.disabled = true;
  try {
    await submeterModal(dadosDoModal());
    fecharModal();
  } catch (err) {
    toast(err.message, 'erro');
  } finally {
    botao.disabled = false;
  }
});

document.getElementById('procura').addEventListener('input', ev => {
  estado.filtros.q = ev.target.value.trim();
  procuraAdiada(() => carregar().catch(e => toast(e.message, 'erro')));
});
document.getElementById('filtroEstado').addEventListener('change', ev => {
  estado.filtros.estado = ev.target.value;
  carregar().catch(e => toast(e.message, 'erro'));
});
document.getElementById('filtroDivisao').addEventListener('change', ev => {

});

// A linha abre-se também pelo teclado: Tab até ela e Enter, como num botão.
document.getElementById('tabela').addEventListener('keydown', ev => {
  const linha = ev.target.closest && ev.target.closest('tr[data-detalhe]');
  if (!linha || ev.target !== linha || (ev.key !== 'Enter' && ev.key !== ' ')) return;
  ev.preventDefault();
  abrirDetalhe(Number(linha.dataset.detalhe)).catch(e => toast(e.message, 'erro'));

document.addEventListener('keydown', ev => {

/**
 * Propor para abate e os autos de abate.
 *
 * Este bloco é o mesmo nas cinco páginas, copiado de propósito: as páginas não
 * partilham código (ver o CLAUDE.md). O que é comum vive no servidor, no
 * `server/routes/iga/autos.js`, e o fluxo está na migração 006: propõe-se, o
 * auto junta os propostos desta categoria, imprime-se no modelo da DMSI, e só
 * ao homologar é que o equipamento fica abatido.
 *
 * Os cliques deste bloco são apanhados na fase de captura e não seguem: os
 * botões vivem dentro de linhas que abrem a ficha, e o clique não pode chegar
 * lá abaixo.
 */

const DESTINO_HABITUAL = 'RESIR - Resíduos Industriais e Reciclagem, Lda';

/** A etiqueta pequena que vai ao lado do estado, na tabela. */
function etiquetaAbate(estadoAbate) {
  if (estadoAbate === 'proposto') {
    return ' <span class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-800 whitespace-nowrap" title="Proposto para abate, à espera de auto homologado">p/ abate</span>';
  }
  if (estadoAbate === 'abatido') {
    return ' <span class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-slate-200 text-slate-700 whitespace-nowrap">abatido</span>';
  }
  return '';
}

function painelAberto() {
  return !document.getElementById('painel').classList.contains('hidden');
}

/** A secção do detalhe: proposto (com o auto, se já tiver) ou abatido. */
function seccaoAbate(ab, idEquipamento) {
  if (!ab) return '';
  const auto = ab.auto
    ? `Auto de abate n.º ${esc(ab.auto.numero_texto)}${ab.auto.estado === 'rascunho' ? ' (por homologar)' : ''}`
    : '';
  if (ab.estado === 'proposto') {
    return `<section class="bg-amber-50 border border-amber-200 rounded-lg p-4">
      <h3 class="text-sm font-bold text-amber-900 mb-1">Proposto para abate</h3>
      <p class="text-sm text-amber-900">${esc(ab.motivo || 'sem motivo')}</p>
      <p class="text-xs text-amber-800 mt-1">Apto para doação: ${esc(ab.apto_texto || '—')} · ${auto || 'ainda sem auto'}</p>
      ${estado.permissoes.canEdit
        ? `<button data-retirar-abate="${idEquipamento}" class="mt-2 text-xs font-semibold text-red-600 hover:underline">Retirar a proposta</button>` : ''}
    </section>`;
  }
  // Um abate de antes dos autos ainda se anula, pela administração; um feito por
  // auto homologado não — o papel está assinado.
  const podeAnular = !ab.auto && estado.permissoes.canAdmin;
  return `<section class="bg-slate-100 border border-slate-200 rounded-lg p-4">
    <h3 class="text-sm font-bold text-slate-700 mb-1">Abatido${ab.data_abate ? ' em ' + dataPt(ab.data_abate) : ''}</h3>
    <p class="text-sm text-slate-600">${auto || esc(ab.motivo || 'sem motivo registado')}</p>
    ${auto && ab.motivo && !/^Auto de abate/.test(ab.motivo) ? `<p class="text-xs text-slate-500 mt-1">${esc(ab.motivo)}</p>` : ''}
    ${podeAnular ? `<button data-retirar-abate="${idEquipamento}" class="mt-2 text-xs font-semibold text-red-600 hover:underline">Anular abate</button>` : ''}
  </section>`;
}

    titulo: 'Propor para abate',
    ajuda: 'Fica marcado até entrar num auto de abate e o auto ser homologado. Até lá não conta como abatido, e não se entrega.',
    campos: [
      { nome: 'motivo', rotulo: 'Motivo', tipo: 'text', obrigatorio: true, dica: 'Inoperacional, obsoleto, extraviado…' },
      { nome: 'apto_doacao', rotulo: 'Apto para doação', tipo: 'select', valor: 'nao', opcoes: [
        { valor: 'nao', texto: 'Não' },
        { valor: 'sim', texto: 'Sim' },
      ] },
      { nome: 'caracteristicas', rotulo: 'Características técnicas', tipo: 'text',
        dica: 'Só se for apto para doação', nota: 'Vai para a coluna "Apto para doação" do auto.' },
      { nome: 'obs', rotulo: 'Observações', tipo: 'textarea' },
    ],
    textoGravar: 'Propor',
    gravar: async d => {
      await enviar(`/${id}/abate`, d);
      toast('Proposto para abate.');
      await refrescar(painelAberto() ? id : null);
    },
  });
}

async function retirarAbate(id) {
  if (!confirm('Retirar a proposta (ou anular o abate) e devolver o equipamento ao parque?')) return;
  await pedir(`/${id}/abate`, { method: 'DELETE' });
  toast('Feito.');
  await refrescar(id);
}

// ─── Painel dos autos ──────────────────────────────────────

const ESTADOS_AUTO = {
  rascunho:   { texto: 'Por homologar', classe: 'bg-amber-100 text-amber-800' },
  homologado: { texto: 'Homologado',    classe: 'bg-slate-200 text-slate-700' },
};

function etiquetaAuto(e) {
  const x = ESTADOS_AUTO[e] || { texto: e, classe: 'bg-slate-100 text-slate-600' };
  return `<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full ${x.classe}">${esc(x.texto)}</span>`;
}

const botaoSecundario = 'text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700';
const botaoPrimario = 'text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white disabled:opacity-40';

async function abrirAutos() {
  const r = await pedir('/autos');
  estado.autos = r.autos;
  estado.proximoAuto = r.proximo;
  const pode = estado.permissoes.canEdit;
  document.getElementById('painelTitulo').textContent = 'Autos de abate';
  document.getElementById('painelSubtitulo').textContent = r.propostos_soltos
    ? `${r.propostos_soltos} proposto${r.propostos_soltos === 1 ? '' : 's'} à espera de auto`
    : 'Nenhum proposto à espera de auto';
  document.getElementById('painelCorpo').innerHTML = `
    <section class="space-y-2">
      ${pode ? `<button data-auto-novo class="${botaoPrimario}" ${r.propostos_soltos ? '' : 'disabled'}>
        ${!r.propostos_soltos ? 'Novo auto — não há propostos' : r.propostos_soltos === 1 ? 'Novo auto com o proposto' : `Novo auto com os ${r.propostos_soltos} propostos`}</button>` : ''}
      <p class="text-xs text-slate-500">Cada auto leva só equipamento desta página. O n.º é o do papel (o IGA sugere
        o seguinte ao último do ano), e a 1.ª folha sai no modelo da DMSI.</p>
    </section>
    <section>
      <ul class="divide-y divide-slate-100">${r.autos.length ? r.autos.map(a => `
        <li><button data-auto="${a.id}" class="w-full text-left flex items-center gap-3 py-2.5 hover:bg-slate-50 rounded">
          <span class="font-bold text-slate-900 w-20">${esc(a.numero_texto)}</span>
          <span class="text-sm text-slate-600 flex-1">${dataPt(a.data)} · ${a.itens} equipamento${a.itens === 1 ? '' : 's'}</span>
          ${etiquetaAuto(a.estado)}
        </button></li>`).join('') : '<li class="text-sm text-slate-600 py-2">Ainda não há autos de abate.</li>'}
      </ul>
    </section>`;
  document.getElementById('painel').classList.remove('hidden');
}

async function abrirAuto(id) {
  const a = await pedir('/autos/' + id);
  estado.autoAberto = a;
  const rascunho = a.estado === 'rascunho';
  const podeEditar = rascunho && estado.permissoes.canEdit;
  const comissao = [a.comissao1, a.comissao2, a.comissao3].filter(Boolean).map(esc).join('<br>');

  document.getElementById('painelTitulo').textContent = `Auto de abate n.º ${a.numero_texto}`;
  document.getElementById('painelSubtitulo').textContent =
    `${dataPt(a.data)} · ${a.itens.length} equipamento${a.itens.length === 1 ? '' : 's'}`;
  document.getElementById('painelCorpo').innerHTML = `
    <section>
      <div class="flex flex-wrap items-center gap-2 mb-3">
        ${etiquetaAuto(a.estado)}
        ${a.data_homologacao ? `<span class="text-xs text-slate-500">em ${dataPt(a.data_homologacao)}</span>` : ''}
        <button data-autos class="ml-auto text-xs font-semibold text-blue-600 hover:underline">← Todos os autos</button>
      </div>
      <dl class="grid grid-cols-2 gap-3">
        ${linhaCampo('Data', dataPt(a.data))}
        ${linhaCampo('Comissão', comissao)}
        ${linhaCampo('Entidade responsável', esc(a.destino))}
        ${linhaCampo('Valor do auto', esc(a.valor))}
      </dl>
      ${a.obs ? `<p class="mt-3 text-sm bg-slate-50 border border-slate-200 text-slate-700 rounded-lg p-3">${esc(a.obs)}</p>` : ''}
      <div class="flex flex-wrap gap-2 mt-4">
        <a href="${API}/autos/${a.id}/pdf" target="_blank" rel="noopener" class="${botaoPrimario}">Imprimir o auto (PDF)</a>
        ${podeEditar ? `<button data-auto-editar class="${botaoSecundario}">Editar</button>
                        <button data-auto-acrescentar class="${botaoSecundario}">Juntar propostos novos</button>` : ''}
        ${rascunho && estado.permissoes.canAdmin ? `<button data-auto-homologar class="${botaoSecundario} text-emerald-700 border-emerald-300">Homologar</button>` : ''}
        ${podeEditar ? `<button data-auto-apagar class="${botaoSecundario} text-red-600 border-red-200">Apagar</button>` : ''}
      </div>
      ${rascunho ? '<p class="text-xs text-slate-500 mt-2">Homologar é o último passo, quando o auto vier assinado: o equipamento fica abatido na data do auto.</p>' : ''}
    </section>
    <section>
      <h3 class="text-sm font-bold text-slate-700 mb-1">Equipamentos</h3>
      <ul class="divide-y divide-slate-100">${a.itens.map(i => `
        <li class="flex gap-3 py-2 text-sm">
          <div class="flex-1">
            <div class="font-semibold text-slate-800">${esc(i.identificacao || '—')}
              <span class="font-normal text-slate-500">· ${esc(i.descricao || '')} · ${esc(i.marca || '')}</span></div>
            <div class="text-xs text-slate-500">Série ${esc(i.serie || '—')} · ${esc(i.motivo || '')}
              ${i.apto_texto ? ` · apto para doação: ${esc(i.apto_texto)}` : ''}</div>
          </div>
          ${podeEditar ? `<button data-auto-tirar="${i.id}" class="text-xs font-semibold text-red-600 hover:underline self-center">Tirar</button>` : ''}
        </li>`).join('') || '<li class="text-sm text-slate-600 py-2">Sem equipamentos.</li>'}
      </ul>
    </section>`;
  document.getElementById('painel').classList.remove('hidden');
}

/**
 * A janela do auto: o que o modelo da DMSI pede, por esta ordem. Num auto novo a
 * comissão e a entidade vêm do último (costumam ser as mesmas), e o n.º vem
 * sugerido — mas é o do papel que conta, e corrige-se aqui.
 */
function camposAuto(a) {
  return [
    { nome: 'numero', rotulo: 'N.º do auto de abate', tipo: 'number', valor: a.numero, obrigatorio: true,
      nota: a.sugerido ? `Sugerido: o seguinte ao último lançado em ${a.ano}. Escreva o do papel, se for outro.`
                       : 'O ano é o da data do auto.' },
    { nome: 'data', rotulo: 'Data da reunião da comissão', tipo: 'date', valor: a.data ? String(a.data).slice(0, 10) : hojeISO() },
    { nome: 'comissao1', rotulo: 'Comissão — 1.º elemento', tipo: 'text', valor: a.comissao1, dica: 'Chefe Hélio Marques', obrigatorio: true },
    { nome: 'comissao2', rotulo: 'Comissão — 2.º elemento', tipo: 'text', valor: a.comissao2 },
    { nome: 'comissao3', rotulo: 'Comissão — 3.º elemento', tipo: 'text', valor: a.comissao3 },
    { nome: 'valor', rotulo: 'Valor do auto', tipo: 'text', valor: a.valor,
      nota: 'Vazio, e com mais de 10 equipamentos, fica "Em anexo a lista…".' },
    { nome: 'destino', rotulo: 'Entidade responsável pelo equipamento a abater', tipo: 'text',
      valor: a.destino || DESTINO_HABITUAL, obrigatorio: true,
      nota: 'É o "abatendo-os à responsabilidade de" do auto.' },
    { nome: 'obs', rotulo: 'Observações (não vão para o papel)', tipo: 'textarea', valor: a.obs },
  ];
}

function modalNovoAuto() {
  const ultimo = (estado.autos || [])[0] || {};
  abrirModal({
    titulo: 'Novo auto de abate',
    ajuda: 'Junta todos os propostos desta página que ainda não estão num auto.',
    campos: camposAuto({ numero: (estado.proximoAuto || {}).numero, ano: (estado.proximoAuto || {}).ano, sugerido: true,
                         comissao1: ultimo.comissao1, comissao2: ultimo.comissao2,
                         comissao3: ultimo.comissao3, destino: ultimo.destino }),
    textoGravar: 'Criar o auto',
    gravar: async d => {
      const r = await enviar('/autos', d);
      toast(`Auto de abate n.º ${r.numero_texto} criado.`);
      await refrescar(null);
      await abrirAuto(r.id);
    },
  });
}

function modalEditarAuto() {
  const a = estado.autoAberto;
  abrirModal({
    titulo: `Editar o Auto n.º ${a.numero_texto}`,
    campos: camposAuto(a),
    gravar: async d => {
      await enviar(`/autos/${a.id}`, d, 'PUT');
      toast('Auto gravado.');
      await abrirAuto(a.id);
    },
  });
}

async function accaoAuto(alvo) {
  const a = estado.autoAberto;
  if (alvo.matches('[data-autos]')) return abrirAutos();
  if (alvo.matches('[data-auto-novo]')) return modalNovoAuto();
  if (alvo.matches('[data-auto]')) return abrirAuto(Number(alvo.dataset.auto));
  if (alvo.matches('[data-auto-editar]')) return modalEditarAuto();
  if (alvo.matches('[data-auto-acrescentar]')) {
    const r = await enviar(`/autos/${a.id}/acrescentar`, {});
    toast(r.acrescentados ? `Juntados ${r.acrescentados}.` : 'Não havia propostos novos.', r.acrescentados ? undefined : 'aviso');
    return abrirAuto(a.id);
  }
  if (alvo.matches('[data-auto-tirar]')) {
    await pedir(`/autos/${a.id}/itens/${alvo.dataset.autoTirar}`, { method: 'DELETE' });
    toast('Saiu do auto; continua proposto.');
    return abrirAuto(a.id);
  }
  if (alvo.matches('[data-auto-homologar]')) {
    if (!confirm(`Homologar o Auto n.º ${a.numero_texto}? Os ${a.itens.length} equipamentos ficam abatidos a ${dataPt(a.data)}, e isto não se desfaz.`)) return;
    const r = await enviar(`/autos/${a.id}/homologar`, {});
    toast(`Auto homologado: ${r.abatidos} abatidos.`);
    await refrescar(null);
    return abrirAuto(a.id);
  }
  if (alvo.matches('[data-auto-apagar]')) {
    if (!confirm(`Apagar o Auto n.º ${a.numero_texto}? Os equipamentos continuam propostos, e o n.º fica livre.`)) return;
    await pedir(`/autos/${a.id}`, { method: 'DELETE' });
    toast('Auto apagado.');
    return abrirAutos();
  }
}

document.addEventListener('click', async ev => {
  const alvo = ev.target.closest('[data-propor],[data-retirar-abate],#btnAutos,[data-autos],[data-auto-novo],[data-auto],[data-auto-editar],[data-auto-acrescentar],[data-auto-tirar],[data-auto-homologar],[data-auto-apagar]');
  if (!alvo) return;
  ev.stopPropagation();
  try {
    if (alvo.matches('[data-propor]')) return modalProporAbate(Number(alvo.dataset.propor));
    if (alvo.matches('[data-retirar-abate]')) return await retirarAbate(Number(alvo.dataset.retirarAbate));
    if (alvo.id === 'btnAutos') return await abrirAutos();
    await accaoAuto(alvo);
  } catch (err) {
    toast(err.message, 'erro');
  }
}, true);

// ─── Arranque ──────────────────────────────────────────────

/**
 * O ecrã de paragem — o mesmo das outras páginas e do `iga.html`.
 *
 * A `conta` existe porque quem cá chega sem acesso vai ter de pedir a alguém que
 * lho dê, e a primeira coisa que lhe perguntam do outro lado é "qual é a conta?".
 * O `#app` esconde-se por baixo: a cortina é opaca, mas sem isto a página ficava
 * toda navegável pelo Tab por trás dela.
 */
function mostrarErro(titulo, detalhe, conta) {
  document.getElementById('erroTitulo').textContent = titulo;
  document.getElementById('erroDetalhe').textContent = detalhe || '';
  const linhaConta = document.getElementById('erroConta');
  linhaConta.innerHTML = conta
    ? `Indique esta conta ao pedir o acesso:<span class="block mt-1 font-mono text-sm font-bold text-slate-900 select-all">${esc(conta)}</span>`
    : '';
  linhaConta.classList.toggle('hidden', !conta);
  document.getElementById('app').classList.add('hidden');
  // O atalho "Saltar para o conteúdo" vive fora do #app: sem isto ficava a ser o
  // único elemento tabulável com a cortina em cima, e a saltar para o que ela
  // acabou de esconder.
  const atalho = document.querySelector('a[href="#conteudo"]');
  if (atalho) atalho.hidden = true;
  document.getElementById('ecraErro').classList.remove('hidden');
}

async function arrancar() {
  try {
    estado.permissoes = await pedir('/permissoes', null, API_MODULO);
  } catch (err) {
    // O motivo fica no console: a quem está à porta, "Erro 500" não abre nada,
    // e no dia em que um proxy responda por cima do servidor era o nome da base
    // a aparecer em ecrã inteiro a toda a gente com IGA-Consulta.
    console.error('[iga] /permissoes falhou:', (err && err.message) || err);
    return mostrarErro('Não foi possível confirmar as permissões.',
      'Volte a carregar a página. Se o problema se mantiver, contacte o NSIC.');
  }
  // Sem username não é falta de grupo: é a identificação de domínio que não
  // chegou, e o caminho para o resolver é outro.
  if (!estado.permissoes.username) {
    return mostrarErro('Não foi possível identificar a sua conta.',
      'O acesso ao inventário é dado à conta de domínio, e esta sessão não trouxe nenhuma. '
      + 'Volte a carregar a página; se o problema se mantiver, contacte o NSIC.');
  }
  if (!estado.permissoes.canView) {
    return mostrarErro('Acesso reservado ao Inventário e Gestão de Ativos.',
      'O acesso é dado por grupo. Solicite ao NSIC a inclusão no grupo "IGA" '
      + '(registo e consulta) ou "IGA-Consulta" (apenas consulta).',
      estado.permissoes.username);
  }

  document.getElementById('nomeUtilizador').textContent =
    estado.permissoes.nome || estado.permissoes.username || '—';
  document.getElementById('etiquetaAcesso').textContent =
    estado.permissoes.canAdmin ? 'Administração' : estado.permissoes.canEdit ? 'Escrita' : 'Só consulta';
  if (estado.permissoes.canEdit) document.getElementById('btnNovo').classList.remove('hidden');

  try {
    await Promise.all([carregarEstatisticas(), carregar(), carregarDivisoes()]);
  } catch (err) {
    toast(err.message, 'erro');
  }
  if (window.lucide) lucide.createIcons();
}

arrancar();
</script>
