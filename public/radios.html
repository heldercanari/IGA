<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádios · IGA</title>
    <link rel="icon" type="image/png" href="/iga/favicon.png">
    <!-- Sem `defer`: o Tailwind v4 em browser compila as classes em JS e só as
         aplica quando corre. Adiado para depois do parse, o browser chega a pintar
         a página em cru. O ficheiro é local, não vem de CDN nenhum. O lucide fica
         adiado — é só ícones, e o script de baixo já espera por ele. -->
    <script src="/iga/tailwind.global.js"></script>
    <script src="/iga/lucide.min.js" defer></script>
    <style>
        /* `hidden` é uma classe do Tailwind, portanto só existe depois de ele
           compilar. Declará-la aqui garante que os modais e o toast não aparecem
           empilhados na fracção de segundo anterior. */
        .hidden { display: none; }

        body, input, select, textarea, button {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        /* Cabeçalho da tabela colado ao topo enquanto se percorre o parque: são
           400 linhas e sem isto perde-se a conta às colunas. */
        thead.pegajoso th { position: sticky; top: 0; z-index: 10; }
        tbody tr { line-height: 1.3; }
        .accao {
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 6px; border: none;
            background: transparent; cursor: pointer; flex-shrink: 0;
            transition: background-color .15s, transform .1s;
        }
        .accao:hover { transform: scale(1.12); }
        .accao:disabled { opacity: .25; cursor: not-allowed; transform: none; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important; animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-blue-600 focus:text-white focus:px-4 focus:py-2 focus:rounded">Saltar para o conteúdo</a>

</div>

<script>
'use strict';

const API = '/api/iga/radios';   // as rotas deste ecrã
const API_MODULO = '/api/iga';    // /permissoes é do módulo, não do tipo

const estado = {
  permissoes: null,
  radios: [],
  filtros: { q: '', estado: '', marca: '' },
  radioAberto: null,
};

// ─── Utilitários ───────────────────────────────────────────

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/**
 * Datas em dd/mm/aaaa, lidas em UTC.
 *
 * A base guarda DATE e o SQL Server devolve-a como meia-noite UTC. Ler as
 * componentes locais fazia a data recuar um dia em qualquer fuso a oeste de
 * Lisboa — e a intranet é consultada de casa.
 */
function dataPt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return esc(v);
  return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`;
}

function hojeISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

let toastTimer = null;
function toast(msg, tipo) {
  const el = document.getElementById('toast');
  const cor = tipo === 'erro' ? 'bg-red-600' : tipo === 'aviso' ? 'bg-amber-600' : 'bg-emerald-600';
  el.className = `fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl text-sm font-semibold text-white ${cor}`;
  document.getElementById('toastIcone').innerHTML =
    `<i data-lucide="${tipo === 'erro' ? 'alert-circle' : tipo === 'aviso' ? 'alert-triangle' : 'check-circle'}" class="w-5 h-5"></i>`;
  document.getElementById('toastMsg').textContent = msg;
  if (window.lucide) lucide.createIcons();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 4000);
}

async function pedir(caminho, opcoes, base) {
  const r = await fetch((base || API) + caminho, Object.assign({ headers: { 'Accept': 'application/json' } }, opcoes));
  let corpo = null;
  try { corpo = await r.json(); } catch (e) { /* resposta sem JSON */ }
  if (!r.ok) throw new Error((corpo && corpo.error) || `Erro ${r.status}`);
  return corpo;
}

function enviar(caminho, dados, metodo) {
  return pedir(caminho, {
    method: metodo || 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(dados || {}),
  });
}

// ─── Etiquetas ─────────────────────────────────────────────

const ESTADOS = {
  atribuido:  { texto: 'Entregue',   classe: 'bg-blue-100 text-blue-800' },
  disponivel: { texto: 'Disponível', classe: 'bg-emerald-100 text-emerald-800' },
  avariado:   { texto: 'Avariado',   classe: 'bg-amber-100 text-amber-800' },
  abatido:    { texto: 'Abatido',    classe: 'bg-slate-200 text-slate-700' },
};

function etiqueta(mapa, chave) {
  const e = mapa[chave] || { texto: chave || '—', classe: 'bg-slate-100 text-slate-600' };
  return `<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full ${e.classe}">${esc(e.texto)}</span>`;
}

// ─── Parque ────────────────────────────────────────────────

async function carregarParque() {
  const p = new URLSearchParams();
  if (estado.filtros.q) p.set('q', estado.filtros.q);
  if (estado.filtros.estado) p.set('estado', estado.filtros.estado);
  if (estado.filtros.marca) p.set('marca', estado.filtros.marca);
  estado.radios = await pedir('/?' + p.toString());
  desenharParque();
}

function desenharParque() {
  const podeEditar = estado.permissoes && estado.permissoes.canEdit;
  const podeAdmin = estado.permissoes && estado.permissoes.canAdmin;
  const corpo = document.getElementById('tabelaParque');

  if (!estado.radios.length) {
    corpo.innerHTML = `<tr><td colspan="7" class="px-4 py-10 text-center text-slate-400 text-sm">
      Nenhum rádio encontrado com estes filtros.</td></tr>`;
    document.getElementById('rodapeParque').textContent = '';
    return;
  }

  corpo.innerHTML = estado.radios.map(r => {
    const atribuido = r.matricula || r.nome_utilizador
      ? `${esc(r.nome_utilizador || '—')}${r.matricula ? ` <span class="text-slate-400">· ${esc(r.matricula)}</span>` : ''}`
      : '<span class="text-slate-300">—</span>';
    return `<tr class="hover:bg-slate-50">
      <td class="px-3 py-2 text-slate-700">${r.alias_tei ? esc(r.alias_tei) : '<span class="text-slate-300">—</span>'}</td>
      <td class="px-3 py-2 font-bold text-slate-900">${esc(r.indicativo || '—')}</td>
      <td class="px-3 py-2 font-mono text-xs text-slate-600">${r.num_serie ? esc(r.num_serie) : '<span class="text-slate-300">—</span>'}</td>
      <td class="px-3 py-2">${etiqueta(ESTADOS, r.estado)}</td>
      <td class="px-3 py-2">${atribuido}</td>
      <td class="px-3 py-2 text-slate-600 whitespace-nowrap">${r.data_entrega ? dataPt(r.data_entrega) : '<span class="text-slate-300">—</span>'}</td>
      <td class="px-3 py-2 text-right whitespace-nowrap">
        <button class="accao text-slate-500 hover:bg-slate-100" data-detalhe="${r.id}" title="Ver detalhe" aria-label="Ver detalhe do rádio ${esc(r.indicativo || r.num_serie || '')}">
          <i data-lucide="eye" class="w-4 h-4"></i></button>
        <button class="accao text-blue-600 hover:bg-blue-50" data-entregar="${r.id}" title="Entregar" ${podeEditar && r.estado !== 'abatido' ? '' : 'disabled'}>
          <i data-lucide="user-plus" class="w-4 h-4"></i></button>
        <button class="accao text-emerald-600 hover:bg-emerald-50" data-devolver="${r.id}" title="Devolver" ${podeEditar && r.atribuicao_id ? '' : 'disabled'}>
          <i data-lucide="undo-2" class="w-4 h-4"></i></button>
        <button class="accao text-amber-600 hover:bg-amber-50" data-avaria="${r.id}" title="Registar avaria" ${podeEditar && r.estado !== 'abatido' ? '' : 'disabled'}>
          <i data-lucide="wrench" class="w-4 h-4"></i></button>
        <button class="accao text-slate-600 hover:bg-slate-100" data-abate="${r.id}" title="Abater" ${podeAdmin && r.estado !== 'abatido' ? '' : 'disabled'}>
          <i data-lucide="archive" class="w-4 h-4"></i></button>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('rodapeParque').textContent =
    `${estado.radios.length} ${estado.radios.length === 1 ? 'rádio' : 'rádios'}` +
    (estado.filtros.q || estado.filtros.estado || estado.filtros.marca ? ' (filtrado)' : '');
  if (window.lucide) lucide.createIcons();
}

async function carregarEstatisticas() {
  const e = await pedir('/estatisticas');
  document.getElementById('kpiTotal').textContent = e.total;
  document.getElementById('kpiAtribuidos').textContent = e.atribuidos;
  document.getElementById('kpiDisponiveis').textContent = e.disponiveis;
  document.getElementById('kpiAvariados').textContent = e.avariados;
  document.getElementById('kpiAbatidos').textContent = e.abatidos;
  document.getElementById('kpiSemSerie').textContent = e.sem_serie;

  const sel = document.getElementById('filtroMarca');
  const escolhida = sel.value;
  sel.innerHTML = '<option value="">Todas</option>' + (e.marcas || [])
    .filter(m => m.marca && m.marca !== '(sem marca)')
    .map(m => `<option value="${esc(m.marca)}">${esc(m.marca)} (${m.total})</option>`).join('');
  sel.value = escolhida;
}

// ─── Detalhe ───────────────────────────────────────────────

function linhaCampo(rotulo, valor) {
  return `<div>
    <dt class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold">${esc(rotulo)}</dt>
    <dd class="text-sm text-slate-800">${valor || '<span class="text-slate-300">—</span>'}</dd>
  </div>`;
}

async function abrirDetalhe(id) {
  const r = await pedir('/' + id);
  estado.radioAberto = r;

  document.getElementById('painelTitulo').textContent = r.indicativo ? `Rádio ${r.indicativo}` : 'Rádio sem indicativo';
  document.getElementById('painelSubtitulo').innerHTML =
    `${esc(r.marca || '')} ${esc(r.modelo || '')} · ${r.num_serie ? esc(r.num_serie) : 'sem número de série'}`;

  const atribuicoes = r.atribuicoes.length ? r.atribuicoes.map(a => `
    <li class="flex gap-3 py-2 border-b border-slate-100 last:border-0">
      <span class="mt-1 w-2 h-2 rounded-full flex-shrink-0 ${a.data_devolucao ? 'bg-slate-300' : 'bg-blue-500'}"></span>
      <div class="text-sm">
        <div class="font-semibold text-slate-800">${esc(a.nome_utilizador || 'sem nome')}
          ${a.matricula ? `<span class="text-slate-400 font-normal">· ${esc(a.matricula)}</span>` : ''}</div>
        <div class="text-xs text-slate-500">
          ${dataPt(a.data_entrega)} → ${a.data_devolucao ? dataPt(a.data_devolucao) : '<span class="text-blue-600 font-semibold">ainda o tem</span>'}
          ${a.guia ? ' · guia' : ''}
        </div>
        ${a.obs ? `<div class="text-xs text-slate-400 mt-0.5">${esc(a.obs)}</div>` : ''}
      </div>
    </li>`).join('') : '<li class="text-sm text-slate-400 py-2">Nunca foi entregue.</li>';

  const avarias = r.avarias.length ? r.avarias.map(a => `
    <li class="flex gap-3 py-2 border-b border-slate-100 last:border-0">
      <span class="mt-1 w-2 h-2 rounded-full flex-shrink-0 ${a.estado === 'aberta' ? 'bg-amber-500' : 'bg-slate-300'}"></span>
      <div class="text-sm flex-1">
        <div class="font-semibold text-slate-800">${esc(a.tipo_avaria || 'por classificar')}
          <span class="text-xs font-normal text-slate-400">${a.ordem === 'P' ? '· programação' : a.ordem === '*' ? '· física' : ''}</span>
        </div>
        <div class="text-xs text-slate-500">
          ${a.estado === 'aberta' ? `aberta desde ${dataPt(a.data_registo)} · ${esc(a.localizacao || '—')}`
                                  : `${a.estado === 'reparada' ? 'reparada' : 'irreparável'} em ${dataPt(a.data_reparacao)}`}
        </div>
      </div>
      ${a.estado === 'aberta' && estado.permissoes.canEdit
        ? `<button class="text-xs font-semibold text-emerald-700 hover:underline" data-reparar="${a.id}">Fechar</button>` : ''}
    </li>`).join('') : '<li class="text-sm text-slate-400 py-2">Sem avarias registadas.</li>';

  const sistema = r.sistema ? `
    <dl class="grid grid-cols-2 gap-3">
      ${linhaCampo('Alias', esc(r.sistema.alias))}
      ${linhaCampo('ID de rádio', esc(r.sistema.radio_id))}
      ${linhaCampo('Grupo de conversação', esc(r.sistema.talkgroup))}
      ${linhaCampo('Perfil', esc(r.sistema.perfil_capacidades))}
    </dl>`
    : `<p class="text-sm text-slate-400">Este equipamento não aparece na exportação do sistema
       ${r.num_serie ? '(cruzamento por número de série)' : '— sem número de série, não há por onde cruzar'}.</p>`;

  document.getElementById('painelCorpo').innerHTML = `
    <section>
      <div class="flex items-center gap-2 mb-3">
        ${etiqueta(ESTADOS, r.estado)}
        ${estado.permissoes.canEdit ? '<button id="btnEditar" class="ml-auto text-xs font-semibold text-blue-600 hover:underline">Editar equipamento</button>' : ''}
      </div>
      <dl class="grid grid-cols-2 gap-3">
        ${linhaCampo('Indicativo', esc(r.indicativo))}
        ${linhaCampo('Nº de série', r.num_serie ? `<span class="font-mono text-xs">${esc(r.num_serie)}</span>` : '')}
        ${linhaCampo('Marca / modelo', `${esc(r.marca || '')} ${esc(r.modelo || '')}`.trim())}
        ${linhaCampo('Alias TETRA', esc(r.alias_tei))}
        ${linhaCampo('ID de rádio', esc(r.radio_id_tei))}
        ${linhaCampo('TIE', esc(r.tie))}
      </dl>
      ${r.obs ? `<p class="mt-3 text-sm bg-amber-50 border border-amber-200 text-amber-900 rounded-lg p-3">${esc(r.obs)}</p>` : ''}
    </section>

    ${r.abate ? `<section class="bg-slate-100 border border-slate-200 rounded-lg p-4">
      <h3 class="text-sm font-bold text-slate-700 mb-1">Abatido em ${dataPt(r.abate.data_abate)}</h3>
      <p class="text-sm text-slate-600">${esc(r.abate.motivo || 'sem motivo registado')}</p>
      ${estado.permissoes.canAdmin ? '<button id="btnAnularAbate" class="mt-2 text-xs font-semibold text-red-600 hover:underline">Anular abate</button>' : ''}
    </section>` : ''}

    <section>
      <h3 class="text-sm font-bold text-slate-700 mb-1">Entregas</h3>
      <ul>${atribuicoes}</ul>
    </section>

    <section>
      <h3 class="text-sm font-bold text-slate-700 mb-1">Avarias</h3>
      <ul>${avarias}</ul>
    </section>

    <section>
      <h3 class="text-sm font-bold text-slate-700 mb-1">No sistema TETRA</h3>
      ${sistema}
    </section>`;

  document.getElementById('painel').classList.remove('hidden');
  if (window.lucide) lucide.createIcons();
}

function fecharPainel() {
  document.getElementById('painel').classList.add('hidden');
  estado.radioAberto = null;
}

// ─── Modais de formulário ──────────────────────────────────

let submeterModal = null;

function abrirModal({ titulo, ajuda, campos, gravar, textoGravar }) {
  document.getElementById('modalTitulo').textContent = titulo;
  document.getElementById('modalAjuda').textContent = ajuda || '';
  document.getElementById('modalGravar').textContent = textoGravar || 'Gravar';
  document.getElementById('modalForm').innerHTML = campos.map(c => {
    const base = 'w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500';
    const controlo = c.tipo === 'textarea'
      ? `<textarea id="c_${c.nome}" name="${c.nome}" rows="2" class="${base}">${esc(c.valor || '')}</textarea>`
      : c.tipo === 'select'
        ? `<select id="c_${c.nome}" name="${c.nome}" class="${base}">${c.opcoes.map(o =>
            `<option value="${esc(o.valor)}" ${o.valor === c.valor ? 'selected' : ''}>${esc(o.texto)}</option>`).join('')}</select>`
        : `<input id="c_${c.nome}" name="${c.nome}" type="${c.tipo || 'text'}" value="${esc(c.valor || '')}"
             ${c.lista ? `list="${c.lista}"` : ''} ${c.obrigatorio ? 'required' : ''}
             placeholder="${esc(c.dica || '')}" class="${base}">`;
    return `<div>
      <label for="c_${c.nome}" class="block text-xs font-semibold text-slate-600 mb-1">${esc(c.rotulo)}</label>
      ${controlo}
      ${c.nota ? `<p class="text-[11px] text-slate-400 mt-1">${esc(c.nota)}</p>` : ''}
    </div>`;
  }).join('') + '<datalist id="listaPessoas"></datalist>';

  submeterModal = gravar;
  document.getElementById('modal').classList.remove('hidden');
  const primeiro = document.querySelector('#modalForm input, #modalForm select, #modalForm textarea');
  if (primeiro) primeiro.focus();
}

function fecharModal() {
  document.getElementById('modal').classList.add('hidden');
  submeterModal = null;
}

function dadosDoModal() {
  const dados = {};
  new FormData(document.getElementById('modalForm')).forEach((v, k) => { dados[k] = String(v).trim(); });
  return dados;
}

/** Recarrega o que está à vista depois de uma alteração. */
async function refrescar(idDetalhe) {
  await Promise.all([carregarParque(), carregarEstatisticas()]);
  if (idDetalhe) await abrirDetalhe(idDetalhe);
}

function modalEntregar(id) {
  const r = estado.radios.find(x => x.id === id) || estado.radioAberto || {};
  abrirModal({
    titulo: `Entregar o rádio ${r.indicativo || ''}`.trim(),
    ajuda: r.atribuicao_id ? `Está entregue a ${r.nome_utilizador || 'alguém'} — essa entrega é fechada nesta data.` : '',
    campos: [
      { nome: 'matricula', rotulo: 'Matrícula', tipo: 'text', lista: 'listaPessoas', dica: '138415' },
      { nome: 'nome_utilizador', rotulo: 'Nome', tipo: 'text', dica: 'Nome de quem fica com o rádio' },
      { nome: 'data_entrega', rotulo: 'Data de entrega', tipo: 'date', valor: hojeISO() },
      { nome: 'guia', rotulo: 'Guia', tipo: 'text', dica: 'Referência da guia em papel, se houver' },
      { nome: 'obs', rotulo: 'Observações', tipo: 'textarea' },
    ],
    textoGravar: 'Entregar',
    gravar: async d => {
      await enviar(`/${id}/atribuir`, d);
      toast('Entrega registada.');
      await refrescar(estado.radioAberto ? id : null);
    },
  });
  carregarPessoas();
}

async function carregarPessoas() {
  try {
    const pessoas = await pedir('/utilizadores');
    const lista = document.getElementById('listaPessoas');
    if (lista) lista.innerHTML = pessoas.map(p =>
      `<option value="${esc(p.matricula)}">${esc(p.nome || '')}</option>`).join('');
  } catch (e) { /* o autocompletar é um extra: sem ele o campo continua a funcionar */ }
}

function modalDevolver(id) {
  const r = estado.radios.find(x => x.id === id) || estado.radioAberto || {};
  abrirModal({
    titulo: `Devolver o rádio ${r.indicativo || ''}`.trim(),
    ajuda: r.nome_utilizador ? `Entregue a ${r.nome_utilizador}.` : '',
    campos: [
      { nome: 'data_devolucao', rotulo: 'Data de devolução', tipo: 'date', valor: hojeISO() },
      { nome: 'obs', rotulo: 'Observações', tipo: 'textarea', dica: 'Estado em que veio, por exemplo' },
    ],
    textoGravar: 'Devolver',
    gravar: async d => {
      await enviar(`/${id}/devolver`, d);
      toast('Devolução registada.');
      await refrescar(estado.radioAberto ? id : null);
    },
  });
}

function modalAvaria(id) {
  const r = estado.radios.find(x => x.id === id) || estado.radioAberto || {};
  abrirModal({
    titulo: `Registar avaria no rádio ${r.indicativo || ''}`.trim(),
    campos: [
      { nome: 'tipo_avaria', rotulo: 'Avaria', tipo: 'text', obrigatorio: true, dica: 'Prog., n/liga, teclado, ecrã partido…' },
      { nome: 'ordem', rotulo: 'Tipo', tipo: 'select', valor: 'P', opcoes: [
        { valor: 'P', texto: 'P — programação (resolve-se no posto)' },
        { valor: '*', texto: '* — física (vai para reparação)' },
      ] },
      { nome: 'localizacao', rotulo: 'Onde está', tipo: 'select', valor: 'Aguarda Reparação', opcoes: [
        { valor: 'Aguarda Reparação', texto: 'Aguarda reparação' },
        { valor: 'No armazém', texto: 'No armazém' },
        { valor: 'No atendimento', texto: 'No atendimento' },
      ] },
      { nome: 'data_registo', rotulo: 'Data', tipo: 'date', valor: hojeISO() },
      { nome: 'obs', rotulo: 'Observações', tipo: 'textarea' },
    ],
    textoGravar: 'Registar avaria',
    gravar: async d => {
      await enviar(`/${id}/avarias`, d);
      toast('Avaria registada.');
      await refrescar(estado.radioAberto ? id : null);
    },
  });
}

function modalReparar(avariaId) {
  const id = estado.radioAberto ? estado.radioAberto.id : null;
  abrirModal({
    titulo: 'Fechar a avaria',
    campos: [
      { nome: 'estado', rotulo: 'Desfecho', tipo: 'select', valor: 'reparada', opcoes: [
        { valor: 'reparada', texto: 'Reparada — volta ao parque' },
        { valor: 'irreparavel', texto: 'Irreparável — fica para abate' },
      ] },
      { nome: 'data_reparacao', rotulo: 'Data', tipo: 'date', valor: hojeISO() },
      { nome: 'obs', rotulo: 'Observações', tipo: 'textarea' },
    ],
    textoGravar: 'Fechar',
    gravar: async d => {
      await enviar(`/avarias/${avariaId}/reparar`, d);
      toast('Avaria fechada.');
      await refrescar(id);
    },
  });
}

function modalAbate(id) {
  const r = estado.radios.find(x => x.id === id) || estado.radioAberto || {};
  abrirModal({
    titulo: `Abater o rádio ${r.indicativo || ''}`.trim(),
    ajuda: 'O rádio sai do parque activo mas não é apagado: o histórico fica.',
    campos: [
      { nome: 'data_abate', rotulo: 'Data do abate', tipo: 'date', valor: hojeISO() },
      { nome: 'motivo', rotulo: 'Motivo', tipo: 'text', obrigatorio: true, dica: 'Irreparável, extraviado, fim de vida…' },
      { nome: 'obs', rotulo: 'Observações', tipo: 'textarea' },
    ],
    textoGravar: 'Abater',
    gravar: async d => {
      await enviar(`/${id}/abate`, d);
      toast('Rádio abatido.');
      await refrescar(estado.radioAberto ? id : null);
    },
  });
}

function modalEquipamento(r) {
  const novo = !r;
  r = r || {};
  abrirModal({
    titulo: novo ? 'Novo rádio' : `Editar o rádio ${r.indicativo || ''}`.trim(),
    ajuda: novo ? 'Basta o número de série ou o indicativo — nem todo o parque tem os dois.' : '',
    campos: [
      { nome: 'indicativo', rotulo: 'Indicativo', tipo: 'text', valor: r.indicativo, dica: '304' },
      { nome: 'num_serie', rotulo: 'Nº de série', tipo: 'text', valor: r.num_serie },
      { nome: 'marca', rotulo: 'Marca', tipo: 'text', valor: r.marca, dica: 'Sepura / Motorola' },
      { nome: 'modelo', rotulo: 'Modelo', tipo: 'text', valor: r.modelo, dica: 'SC2020 / MXP600' },
      { nome: 'alias_tei', rotulo: 'Alias TETRA', tipo: 'text', valor: r.alias_tei, dica: 'LSB PMG304 LX' },
      { nome: 'radio_id_tei', rotulo: 'ID de rádio', tipo: 'text', valor: r.radio_id_tei },
      { nome: 'tie', rotulo: 'TIE', tipo: 'text', valor: r.tie, nota: 'Só os Motorola o têm.' },
      { nome: 'obs', rotulo: 'Observações', tipo: 'textarea', valor: r.obs },
    ],
    gravar: async d => {
      if (novo) {
        const criado = await enviar('/', d);
        toast('Rádio criado.');
        await refrescar();
        await abrirDetalhe(criado.id);
      } else {
        await enviar('/' + r.id, d, 'PUT');
        toast('Alterações gravadas.');
        await refrescar(r.id);
      }
    },
  });
}

// ─── Exportação ────────────────────────────────────────────

/**
 * CSV com ponto e vírgula e BOM: é o que o Excel em português abre sem pedir
 * nada. Com vírgula, o Excel PT junta tudo numa coluna só.
 */
function exportarCSV() {
  const colunas = ['indicativo', 'num_serie', 'marca', 'modelo', 'alias_tei', 'radio_id_tei',
                   'estado', 'matricula', 'nome_utilizador', 'data_entrega', 'guia', 'tipo_avaria', 'obs'];
  const celula = v => {
    if (v === null || v === undefined) return '';
    const s = String(v).replace(/"/g, '""');
    return /[";\n]/.test(s) ? `"${s}"` : s;
  };
  const linhas = [colunas.join(';')].concat(estado.radios.map(r =>
    colunas.map(c => celula(c === 'data_entrega' && r[c] ? dataPt(r[c]) : r[c])).join(';')));
  const url = URL.createObjectURL(new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `radios_${hojeISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ─── Ligações ──────────────────────────────────────────────

let temporizadorProcura = null;
function procuraAdiada(fn) {
  clearTimeout(temporizadorProcura);
  temporizadorProcura = setTimeout(fn, 250);
}

document.addEventListener('click', async ev => {
  const alvo = ev.target.closest('[data-detalhe],[data-entregar],[data-devolver],[data-avaria],[data-abate],[data-reparar],[data-estado],[data-fechar],[data-fechar-modal],#btnEditar,#btnAnularAbate,#btnNovo,#btnExportar');
  if (!alvo) return;
  const d = alvo.dataset;
  try {
    if (alvo.matches('[data-fechar]')) return fecharPainel();
    if (alvo.matches('[data-fechar-modal]')) return fecharModal();
    if (alvo.id === 'btnExportar') return exportarCSV();
    if (alvo.id === 'btnNovo') return modalEquipamento(null);
    if (alvo.id === 'btnEditar') return modalEquipamento(estado.radioAberto);
    if (alvo.id === 'btnAnularAbate') {
      if (!confirm('Anular o abate e devolver o rádio ao parque?')) return;
      await pedir(`/${estado.radioAberto.id}/abate`, { method: 'DELETE' });
      toast('Abate anulado.');
      return refrescar(estado.radioAberto.id);
    }
    if (d.detalhe) return abrirDetalhe(Number(d.detalhe));
    if (d.entregar) return modalEntregar(Number(d.entregar));
    if (d.devolver) return modalDevolver(Number(d.devolver));
    if (d.avaria) return modalAvaria(Number(d.avaria));
    if (d.abate) return modalAbate(Number(d.abate));
    if (d.reparar) return modalReparar(Number(d.reparar));
    if (d.estado !== undefined && alvo.classList.contains('cartao')) {
      estado.filtros.estado = d.estado;
      document.getElementById('filtroEstado').value = d.estado;
      return carregarParque();
    }
  } catch (err) {
    toast(err.message, 'erro');
  }
});

document.getElementById('modalForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!submeterModal) return;
  const botao = document.getElementById('modalGravar');
  botao.disabled = true;
  try {
    await submeterModal(dadosDoModal());
    fecharModal();
  } catch (err) {
    toast(err.message, 'erro');
  } finally {
    botao.disabled = false;
  }
});

document.getElementById('procura').addEventListener('input', ev => {
  estado.filtros.q = ev.target.value.trim();
  procuraAdiada(() => carregarParque().catch(e => toast(e.message, 'erro')));
});
document.getElementById('filtroEstado').addEventListener('change', ev => {
  estado.filtros.estado = ev.target.value;
  carregarParque().catch(e => toast(e.message, 'erro'));
});
document.getElementById('filtroMarca').addEventListener('change', ev => {
  estado.filtros.marca = ev.target.value;
  carregarParque().catch(e => toast(e.message, 'erro'));
});

document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!document.getElementById('modal').classList.contains('hidden')) return fecharModal();
  if (!document.getElementById('painel').classList.contains('hidden')) return fecharPainel();
});

// ─── Arranque ──────────────────────────────────────────────

async function arrancar() {
  try {
    estado.permissoes = await pedir('/permissoes', null, API_MODULO);
  } catch (err) {
    return mostrarErro('Não foi possível confirmar as permissões.', err.message);
  }
  if (!estado.permissoes.canView) {
    return mostrarErro('Acesso reservado ao Inventário e Gestão de Ativos.',
      'Pede para te adicionarem ao grupo "Radios" (ou "Radios-Consulta" para consulta).');
  }

  document.getElementById('nomeUtilizador').textContent =
    estado.permissoes.nome || estado.permissoes.username || '—';
  document.getElementById('etiquetaAcesso').textContent =
    estado.permissoes.canAdmin ? 'Administração' : estado.permissoes.canEdit ? 'Escrita' : 'Só consulta';
  if (estado.permissoes.canEdit) document.getElementById('btnNovo').classList.remove('hidden');

  try {
    await Promise.all([carregarEstatisticas(), carregarParque()]);
  } catch (err) {
    toast(err.message, 'erro');
  }
  if (window.lucide) lucide.createIcons();
}

function mostrarErro(titulo, detalhe) {
  document.getElementById('erroTitulo').textContent = titulo;
  document.getElementById('erroDetalhe').textContent = detalhe || '';
  document.getElementById('ecraErro').classList.remove('hidden');
}

arrancar();
</script>
