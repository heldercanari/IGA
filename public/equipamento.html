<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipamento · IGA</title>
    <link rel="icon" type="image/png" href="/iga/favicon.png">
    <!-- Sem `defer`: o Tailwind v4 em browser compila as classes em JS e só as
         aplica quando corre. Adiado para depois do parse, o browser chega a pintar
         a página em cru. O ficheiro é local, não vem de CDN nenhum. O lucide fica
         adiado — é só ícones, e o script de baixo já espera por ele. -->
    <script src="/iga/tailwind.global.js"></script>
    <script src="/iga/lucide.min.js" defer></script>
    <style>
        /* `hidden` é uma classe do Tailwind, portanto só existe depois de ele
           compilar. Declará-la aqui garante que os modais e o toast não aparecem
           empilhados na fracção de segundo anterior. */
        .hidden { display: none; }

        body, input, select, textarea, button {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        thead.pegajoso th { position: sticky; top: 0; z-index: 10; }
        tbody tr { line-height: 1.3; }
        .accao {
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 6px; border: none;
            background: transparent; cursor: pointer; flex-shrink: 0;
            transition: background-color .15s, transform .1s;
        }
        .accao:hover { transform: scale(1.12); }
        .accao:disabled { opacity: .25; cursor: not-allowed; transform: none; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important; animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-blue-600 focus:text-white focus:px-4 focus:py-2 focus:rounded">Saltar para o conteúdo</a>

<!-- Toast -->

</div>

<div id="app" class="max-w-[1400px] mx-auto p-6">

        <a href="/iga.html" class="flex items-center gap-4 group" title="Voltar ao início">

<script>
'use strict';

/**
 * A página dos tipos de equipamento criados pelo ecrã.
 *
 * Os seis tipos feitos à mão têm cada um a sua página (ver o CLAUDE.md); esta
 * serve todos os que a administração criar no `tipos.html`. O tipo vem no URL
 * (`equipamento.html?tipo=coletes`) e a definição — nome, modo, campos — vem do
 * `/api/iga/tipos/<código>`: é ela que decide as colunas da tabela, os campos da
 * ficha e do formulário, e que botões existem.
 *
 *   modo 'pessoas'  entregar, devolver, corrigir entregas — como os tablets
 *   modo 'local'    "mudar de local", um campo só — como as impressoras
 *   tem_avarias     registar e fechar avarias
 * Propor para abate e os autos têm todos.
 */
const CODIGO = new URLSearchParams(location.search).get('tipo') || '';
const API = '/api/iga/eq/' + encodeURIComponent(CODIGO);   // as rotas deste ecrã
const API_MODULO = '/api/iga';                             // /permissoes e /tipos são do módulo

const estado = {
  permissoes: null,
  tipo: null,
  lista: [],
  filtros: { q: '', estado: '', local: '' },
  aberto: null,
};

// ─── Utilitários ───────────────────────────────────────────

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/**
 * Datas em dd/mm/aaaa, lidas em UTC.
 *
 * A base guarda DATE e o SQL Server devolve-a como meia-noite UTC. Ler as
 * componentes locais fazia a data recuar um dia em qualquer fuso a oeste de
 * Lisboa — e a intranet é consultada de casa.
 */
function dataPt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return esc(v);
  return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`;
}

function hojeISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

let toastTimer = null;
function toast(msg, tipo) {
  const el = document.getElementById('toast');
  const cor = tipo === 'erro' ? 'bg-red-600' : tipo === 'aviso' ? 'bg-amber-600' : 'bg-emerald-600';
  el.className = `fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl text-sm font-semibold text-white ${cor}`;
  document.getElementById('toastIcone').innerHTML =
    `<i data-lucide="${tipo === 'erro' ? 'alert-circle' : tipo === 'aviso' ? 'alert-triangle' : 'check-circle'}" class="w-5 h-5"></i>`;
  document.getElementById('toastMsg').textContent = msg;
  if (window.lucide) lucide.createIcons();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 4000);
}

async function pedir(caminho, opcoes, base) {
  const r = await fetch((base || API) + caminho, Object.assign({ headers: { 'Accept': 'application/json' } }, opcoes));
  let corpo = null;
  try { corpo = await r.json(); } catch (e) { /* resposta sem JSON */ }
  if (!r.ok) throw new Error((corpo && corpo.error) || `Erro ${r.status}`);
  return corpo;
}

function enviar(caminho, dados, metodo) {
  return pedir(caminho, {
    method: metodo || 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(dados || {}),
  });
}

const ESTADOS = {
  atribuido:  { texto: 'Entregue',   classe: 'bg-blue-100 text-blue-800' },
  disponivel: { texto: 'Disponível', classe: 'bg-emerald-100 text-emerald-800' },
  avariado:   { texto: 'Avariado',   classe: 'bg-amber-100 text-amber-800' },
  abatido:    { texto: 'Abatido',    classe: 'bg-slate-200 text-slate-700' },
};

function etiqueta(chave) {
  const e = ESTADOS[chave] || { texto: chave || '—', classe: 'bg-slate-100 text-slate-600' };
  return `<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full ${e.classe}">${esc(e.texto)}</span>`;
}

function linhaCampo(rotulo, valor) {
  return `<div>
    <dt class="text-[11px] uppercase tracking-wide text-slate-600 font-semibold">${esc(rotulo)}</dt>
    <dd class="text-sm text-slate-800">${valor || '<span class="text-slate-300">—</span>'}</dd>
  </div>`;
}

/** "Colete 12" — o nome por que um equipamento é tratado nos títulos. */
function nomeDe(e) {
  return `${estado.tipo.singular} ${e.identificacao || ''}`.trim();
}

/** Num tipo de local não há "disponível": o que não está avariado nem abatido está ao serviço. */
function etiquetaEstado(e) {
  if (estado.tipo.modo === 'local' && e.estado === 'disponivel') {
    return e.localizacao
      ? '<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Ao serviço</span>'
      : '<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Sem local</span>';
  }
  return etiqueta(e.estado);
}

/** O valor de um campo do tipo, como se lê: datas em dd/mm/aaaa, sim/não por extenso. */
function valorLegivel(campo, v) {
  if (v === null || v === undefined || v === '') return '';
  if (campo.tipo_dado === 'data') return dataPt(v);
  if (campo.tipo_dado === 'simnao') return v ? 'Sim' : 'Não';
  if (campo.tipo_dado === 'numero') return esc(Number(v).toLocaleString('pt-PT'));
  return esc(v);
}

const VAZIO = '<span class="text-slate-300">—</span>';

// ─── O que depende do tipo ─────────────────────────────────

/**
 * Os cartões de contagem. As classes vão escritas por extenso de propósito: o
 * Tailwind só compila as que encontra no ficheiro.
 */
function desenharKpis() {
  const t = estado.tipo;
  const cartoes = [{ id: 'total', rotulo: t.nome, cor: 'text-slate-900', filtro: { estado: '' } }];
  if (t.modo === 'pessoas') {
    cartoes.push({ id: 'atribuidos', rotulo: 'Entregues', cor: 'text-blue-700', filtro: { estado: 'atribuido' } });
    cartoes.push({ id: 'disponiveis', rotulo: 'Disponíveis', cor: 'text-emerald-700', filtro: { estado: 'disponivel' } });
  } else {
    cartoes.push({ id: 'com_local', rotulo: `Com ${t.rotulo_local.toLowerCase()}`, cor: 'text-blue-700' });
    cartoes.push({ id: 'sem_local', rotulo: `Sem ${t.rotulo_local.toLowerCase()}`, cor: 'text-amber-700', filtro: { local: '--sem--' } });
  }
  if (t.tem_avarias) cartoes.push({ id: 'avariados', rotulo: 'Avariados', cor: 'text-amber-700', filtro: { estado: 'avariado' } });
  cartoes.push({ id: 'abatidos', rotulo: 'Abatidos', cor: 'text-slate-600', filtro: { estado: 'abatido' } });

  document.getElementById('kpis').innerHTML = cartoes.map(c => {
    const dentro = `<p class="text-xs text-slate-500 font-medium">${esc(c.rotulo)}</p>
      <p data-kpi="${c.id}" class="text-2xl font-extrabold ${c.cor}">—</p>`;
    return c.filtro
      ? `<button type="button" data-filtrar='${esc(JSON.stringify(c.filtro))}' class="cartao text-left bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-blue-300 transition">${dentro}</button>`
      : `<div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">${dentro}</div>`;
  }).join('');
}

function desenharFiltros() {
  const t = estado.tipo;
  const opcoes = [['', 'Todos']];
  if (t.modo === 'pessoas') opcoes.push(['atribuido', 'Entregues'], ['disponivel', 'Disponíveis']);
  else opcoes.push(['disponivel', 'Ao serviço']);
  if (t.tem_avarias) opcoes.push(['avariado', 'Avariados']);
  opcoes.push(['abatido', 'Abatidos']);
  document.getElementById('filtroEstado').innerHTML =
    opcoes.map(([v, texto]) => `<option value="${v}">${texto}</option>`).join('');

  if (t.modo === 'local') {
    document.getElementById('caixaFiltroLocal').classList.remove('hidden');
    document.getElementById('rotuloFiltroLocal').textContent = t.rotulo_local;
  }
  const partes = [t.rotulo_identificacao];
  if (t.usa_marca) partes.push('marca');
  if (t.usa_modelo) partes.push('modelo');
  if (t.usa_serie) partes.push('série');
  partes.push(t.modo === 'pessoas' ? 'quem o tem' : t.rotulo_local.toLowerCase());
  document.getElementById('procura').placeholder = partes.join(', ') + '…';
  document.getElementById('btnNovo').textContent = `+ Adicionar ${t.singular.toLowerCase()}`;
}

/** Os campos do tipo que a administração marcou para a tabela. */
function camposDaTabela() {
  return estado.tipo.campos.filter(c => c.na_tabela);
}

function desenharCabecalho() {
  const t = estado.tipo;
  const th = (texto, direita) =>
    `<th class="${direita ? 'text-right' : 'text-left'} font-semibold px-3 py-2.5 bg-slate-100">${esc(texto)}</th>`;
  const colunas = [th(t.rotulo_identificacao)];
  if (t.usa_marca || t.usa_modelo) colunas.push(th('Equipamento'));
  for (const c of camposDaTabela()) colunas.push(th(c.rotulo));
  if (t.modo === 'pessoas') colunas.push(th('Quem o tem'), th('Entregue'));
  else colunas.push(th(t.rotulo_local));
  colunas.push(th('Estado'), th('Ações', true));
  document.getElementById('cabecalhoTabela').innerHTML = colunas.join('');
  return colunas.length;
}

// ─── Listagem ──────────────────────────────────────────────

async function carregar() {
  const p = new URLSearchParams();
  if (estado.filtros.q) p.set('q', estado.filtros.q);
  if (estado.filtros.estado) p.set('estado', estado.filtros.estado);
  if (estado.filtros.local) p.set('local', estado.filtros.local);
  estado.lista = await pedir('/?' + p.toString());
  desenhar();
}

function desenhar() {
  const t = estado.tipo;
  const podeEditar = estado.permissoes && estado.permissoes.canEdit;
  const corpo = document.getElementById('tabela');
  const nColunas = desenharCabecalho();
  const filtrado = estado.filtros.q || estado.filtros.estado || estado.filtros.local;

  if (!estado.lista.length) {
    corpo.innerHTML = `<tr><td colspan="${nColunas}" class="px-4 py-10 text-center text-slate-600 text-sm">
      ${filtrado ? 'Nada encontrado com estes filtros.' : `Ainda não há registos em ${esc(t.nome)}.`}</td></tr>`;
    document.getElementById('rodape').textContent = '';
    return;
  }

  corpo.innerHTML = estado.lista.map(e => {
    const celulas = [`<td class="px-3 py-2"><span class="font-bold text-slate-900">${esc(e.identificacao)}</span></td>`];
    if (t.usa_marca || t.usa_modelo) {
      celulas.push(`<td class="px-3 py-2 text-slate-600">${esc([e.marca, e.modelo].filter(Boolean).join(' ')) || VAZIO}</td>`);
    }
    for (const c of camposDaTabela()) {
      celulas.push(`<td class="px-3 py-2 text-slate-600">${valorLegivel(c, e.valores[c.codigo]) || VAZIO}</td>`);
    }
    if (t.modo === 'pessoas') {
      const quem = e.matricula || e.nome_utilizador
        ? `${esc(e.nome_utilizador || '—')}${e.matricula ? ` <span class="text-slate-600">· ${esc(e.matricula)}</span>` : ''}`
        : VAZIO;
      celulas.push(`<td class="px-3 py-2">${quem}</td>`,
        `<td class="px-3 py-2 text-slate-600 whitespace-nowrap">${e.data_entrega ? dataPt(e.data_entrega) : VAZIO}</td>`);
    } else {
      celulas.push(`<td class="px-3 py-2">${esc(e.localizacao) || VAZIO}</td>`);
    }
    celulas.push(`<td class="px-3 py-2">${etiquetaEstado(e)}${etiquetaAbate(e.abate_estado === 'proposto' ? 'proposto' : '')}</td>`);

    // Os botões dependem do que o tipo tem. A linha inteira abre a ficha; os
    // botões ficam por cima — o `closest()` do clique encontra-os antes da linha.
    const vivo = e.estado !== 'abatido';
    const botoes = [];
    if (t.modo === 'pessoas') {
      botoes.push(`<button class="accao text-blue-600 hover:bg-blue-50" data-entregar="${e.id}" title="Entregar" ${podeEditar && vivo && !e.abate_estado ? '' : 'disabled'}>
          <i data-lucide="user-plus" class="w-4 h-4"></i></button>`,
        `<button class="accao text-emerald-600 hover:bg-emerald-50" data-devolver="${e.id}" title="Devolver" ${podeEditar && e.atribuicao_id ? '' : 'disabled'}>
          <i data-lucide="undo-2" class="w-4 h-4"></i></button>`);
    } else {
      botoes.push(`<button class="accao text-blue-600 hover:bg-blue-50" data-local="${e.id}" title="Mudar de ${esc(t.rotulo_local.toLowerCase())}" ${podeEditar && vivo ? '' : 'disabled'}>
          <i data-lucide="map-pin" class="w-4 h-4"></i></button>`);
    }
    if (t.tem_avarias) {
      botoes.push(`<button class="accao text-amber-600 hover:bg-amber-50" data-avaria="${e.id}" title="Registar avaria" ${podeEditar && vivo ? '' : 'disabled'}>
          <i data-lucide="wrench" class="w-4 h-4"></i></button>`);
    }
    botoes.push(`<button class="accao text-slate-600 hover:bg-slate-100" data-propor="${e.id}" title="Propor para abate" ${podeEditar && !e.abate_estado ? '' : 'disabled'}>
          <i data-lucide="archive" class="w-4 h-4"></i></button>`);

    return `<tr class="hover:bg-blue-50 cursor-pointer focus:outline-none focus:bg-blue-50" data-detalhe="${e.id}"

  }).join('');

  document.getElementById('rodape').textContent =
    `${estado.lista.length} ${(estado.lista.length === 1 ? t.singular : t.nome).toLowerCase()}` + (filtrado ? ' (filtrado)' : '');

/** Enche o filtro dos locais com os que existem, sem perder o escolhido. */

/**
 * O campo de formulário de um campo do tipo. O nome leva `v_` à frente para não
 * chocar com os campos base (um campo chamado "Marca" não pode tapar a marca).
 */
function campoDeFormulario(c, valor) {
  const base = { nome: 'v_' + c.codigo, rotulo: c.rotulo + (c.obrigatorio ? ' *' : ''), obrigatorio: c.obrigatorio };
  const tem = valor !== null && valor !== undefined;
  if (c.tipo_dado === 'longo') return { ...base, tipo: 'textarea', valor: tem ? valor : '' };
  if (c.tipo_dado === 'data') return { ...base, tipo: 'date', valor: tem ? String(valor).slice(0, 10) : '' };
  if (c.tipo_dado === 'numero') {
    return { ...base, tipo: 'text', valor: tem ? String(valor).replace('.', ',') : '', dica: 'Número' };
  }
  if (c.tipo_dado === 'simnao') {
    return { ...base, tipo: 'select', valor: valor === true ? 'sim' : valor === false ? 'nao' : '', opcoes: [
      { valor: '', texto: '—' }, { valor: 'sim', texto: 'Sim' }, { valor: 'nao', texto: 'Não' }] };
  }
  if (c.tipo_dado === 'lista') {
    // Um valor gravado que já não está nas opções continua a aparecer: senão,
    // abrir e gravar a ficha apagava-o sem ninguém dar por isso.
    const opcoes = c.opcoes.slice();
    if (tem && !opcoes.includes(valor)) opcoes.unshift(valor);
    return { ...base, tipo: 'select', valor: tem ? valor : '',
      opcoes: [{ valor: '', texto: '—' }].concat(opcoes.map(o => ({ valor: o, texto: o }))) };
  }
  return { ...base, tipo: 'text', valor: tem ? valor : '' };
}

function modalEquipamento(e) {
  const t = estado.tipo;
  const novo = !e;
  e = e || { valores: {} };
  const campos = [{ nome: 'identificacao', rotulo: t.rotulo_identificacao + ' *', tipo: 'text', valor: e.identificacao, obrigatorio: true }];
  if (t.modo === 'local') campos.push({ nome: 'localizacao', rotulo: t.rotulo_local, tipo: 'text', valor: e.localizacao, lista: 'listaLocais' });
  if (t.usa_marca) campos.push({ nome: 'marca', rotulo: 'Marca', tipo: 'text', valor: e.marca });
  if (t.usa_modelo) campos.push({ nome: 'modelo', rotulo: 'Modelo', tipo: 'text', valor: e.modelo });
  if (t.usa_serie) campos.push({ nome: 'num_serie', rotulo: 'Nº de série', tipo: 'text', valor: e.num_serie });
  for (const c of t.campos) campos.push(campoDeFormulario(c, e.valores[c.codigo]));
  campos.push({ nome: 'obs', rotulo: 'Observações', tipo: 'textarea', valor: e.obs });

  abrirModal({
    titulo: novo ? `Adicionar ${t.singular.toLowerCase()}` : `Editar: ${nomeDe(e)}`,
    campos,
    gravar: async d => {
      // Os campos do tipo vão num objecto à parte, sem o `v_`.
      const corpo = { valores: {} };
      for (const [k, v] of Object.entries(d)) {
        if (k.startsWith('v_')) corpo.valores[k.slice(2)] = v;
        else corpo[k] = v;
      }
      if (novo) {
        const criado = await enviar('/', corpo);
        toast('Registo criado.');
        await refrescar();
        await abrirDetalhe(criado.id);
      } else {
        await enviar('/' + e.id, corpo, 'PUT');
        toast('Alterações gravadas.');
        await refrescar(e.id);
      }
    },
  });
  if (t.modo === 'local') listaDeLocais();
}

async function apagar(id) {
  const e = aparelho(id);
  if (!confirm(`Apagar ${nomeDe(e)}? A ficha e o histórico desaparecem, e isto não se desfaz.`)) return;
  await pedir('/' + id, { method: 'DELETE' });
  toast('Registo apagado.');
  fecharPainel();
  await refrescar();
}

/**
 * CSV com ponto e vírgula e BOM: é o que o Excel em português abre sem pedir
 * nada. Leva o que a listagem tem, com os campos do tipo pelo nome que a
 * administração lhes deu.
 */
function exportarCSV() {
  const t = estado.tipo;
  const colunas = [[t.rotulo_identificacao, e => e.identificacao]];
  if (t.usa_marca) colunas.push(['Marca', e => e.marca]);
  if (t.usa_modelo) colunas.push(['Modelo', e => e.modelo]);
  if (t.usa_serie) colunas.push(['Nº de série', e => e.num_serie]);
  if (t.modo === 'local') colunas.push([t.rotulo_local, e => e.localizacao]);
  for (const c of t.campos) {
    colunas.push([c.rotulo, e => {
      const v = e.valores[c.codigo];
      if (v === null || v === undefined) return '';
      return c.tipo_dado === 'data' ? dataPt(v) : c.tipo_dado === 'simnao' ? (v ? 'Sim' : 'Não')
        : c.tipo_dado === 'numero' ? String(v).replace('.', ',') : v;
    }]);
  }
  colunas.push(['Estado', e => e.estado]);
  if (t.modo === 'pessoas') {
    colunas.push(['Matrícula', e => e.matricula], ['Nome', e => e.nome_utilizador],
      ['Data de entrega', e => (e.data_entrega ? dataPt(e.data_entrega) : '')]);
  }
  if (t.tem_avarias) colunas.push(['Avaria', e => e.avaria_descricao]);
  colunas.push(['Observações', e => e.obs]);

  const celula = v => {
    if (v === null || v === undefined) return '';
    const s = String(v).replace(/"/g, '""');
    return /[";\n]/.test(s) ? `"${s}"` : s;
  };
  const linhas = [colunas.map(c => celula(c[0])).join(';')].concat(
    estado.lista.map(e => colunas.map(c => celula(c[1](e))).join(';')));
  const url = URL.createObjectURL(new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `${CODIGO}_${hojeISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

  const alvo = ev.target.closest('[data-detalhe],[data-entregar],[data-devolver],[data-local],[data-avaria],[data-reparar],[data-editar-entrega],[data-apagar],[data-filtrar],[data-fechar],[data-fechar-modal],#btnEditar,#btnNovo,#btnExportar');
  if (!alvo) return;
  const d = alvo.dataset;
  try {
    if (alvo.matches('[data-fechar]')) return fecharPainel();
    if (alvo.matches('[data-fechar-modal]')) return fecharModal();
    if (alvo.id === 'btnExportar') return exportarCSV();
    if (alvo.id === 'btnNovo') return modalEquipamento(null);
    if (alvo.id === 'btnEditar') return modalEquipamento(estado.aberto);
    if (d.apagar) return await apagar(Number(d.apagar));
    if (d.detalhe) return await abrirDetalhe(Number(d.detalhe));
    if (d.entregar) return modalEntregar(Number(d.entregar));
    if (d.devolver) return modalDevolver(Number(d.devolver));
    if (d.local) return modalLocal(Number(d.local));
    if (d.avaria) return modalAvaria(Number(d.avaria));
    if (d.reparar) return modalReparar(Number(d.reparar));
    if (d.editarEntrega) return modalEditarEntrega(Number(d.editarEntrega));
    if (d.filtrar) {
      // Um cartão de contagem filtra a tabela pelo que ele conta.
      const f = JSON.parse(d.filtrar);
      estado.filtros.estado = f.estado || '';
      estado.filtros.local = f.local || '';
      document.getElementById('filtroEstado').value = estado.filtros.estado;
      document.getElementById('filtroLocal').value = estado.filtros.local;
      return await carregar();
    }
  } catch (err) {
    toast(err.message, 'erro');
  }
});

document.getElementById('modalForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!submeterModal) return;
  const botao = document.getElementById('modalGravar');
  botao.disabled = true;
  try {
    await submeterModal(dadosDoModal());
    fecharModal();
  } catch (err) {
    toast(err.message, 'erro');
  } finally {
    botao.disabled = false;
  }
});

document.getElementById('procura').addEventListener('input', ev => {
  estado.filtros.q = ev.target.value.trim();
  procuraAdiada(() => carregar().catch(e => toast(e.message, 'erro')));
});
document.getElementById('filtroEstado').addEventListener('change', ev => {
  estado.filtros.estado = ev.target.value;
  carregar().catch(e => toast(e.message, 'erro'));
});
document.getElementById('filtroLocal').addEventListener('change', ev => {
  estado.filtros.local = ev.target.value;
  carregar().catch(e => toast(e.message, 'erro'));
});

// A linha abre-se também pelo teclado: Tab até ela e Enter, como num botão.
document.getElementById('tabela').addEventListener('keydown', ev => {
  const linha = ev.target.closest && ev.target.closest('tr[data-detalhe]');
  if (!linha || ev.target !== linha || (ev.key !== 'Enter' && ev.key !== ' ')) return;
  ev.preventDefault();
  abrirDetalhe(Number(linha.dataset.detalhe)).catch(e => toast(e.message, 'erro'));
});

document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!document.getElementById('modal').classList.contains('hidden')) return fecharModal();

});

// ─── Abate e autos de abate ────────────────────────────────

/**
 * Propor para abate e os autos de abate.
 *
 * Este bloco é o mesmo das páginas dos tipos feitos à mão, copiado de propósito:
 * as páginas não partilham código (ver o CLAUDE.md). O que é comum vive no servidor, no
 * `server/routes/iga/autos.js`, e o fluxo está na migração 006: propõe-se, o
 * auto junta os propostos desta categoria, imprime-se no modelo da DMSI, e só
 * ao homologar é que o equipamento fica abatido.
 *
 * Os cliques deste bloco são apanhados na fase de captura e não seguem: os
 * botões vivem dentro de linhas que abrem a ficha, e o clique não pode chegar
 * lá abaixo.
 */

const DESTINO_HABITUAL = 'RESIR - Resíduos Industriais e Reciclagem, Lda';

/** A etiqueta pequena que vai ao lado do estado, na tabela. */
function etiquetaAbate(estadoAbate) {
  if (estadoAbate === 'proposto') {
    return ' <span class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-800 whitespace-nowrap" title="Proposto para abate, à espera de auto homologado">p/ abate</span>';
  }
  if (estadoAbate === 'abatido') {
    return ' <span class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-slate-200 text-slate-700 whitespace-nowrap">abatido</span>';
  }
  return '';
}

function painelAberto() {
  return !document.getElementById('painel').classList.contains('hidden');
}

/** A secção do detalhe: proposto (com o auto, se já tiver) ou abatido. */
function seccaoAbate(ab, idEquipamento) {
  if (!ab) return '';
  const auto = ab.auto
    ? `Auto de abate n.º ${esc(ab.auto.numero_texto)}${ab.auto.estado === 'rascunho' ? ' (por homologar)' : ''}`
    : '';
  if (ab.estado === 'proposto') {
    return `<section class="bg-amber-50 border border-amber-200 rounded-lg p-4">
      <h3 class="text-sm font-bold text-amber-900 mb-1">Proposto para abate</h3>
      <p class="text-sm text-amber-900">${esc(ab.motivo || 'sem motivo')}</p>
      <p class="text-xs text-amber-800 mt-1">Apto para doação: ${esc(ab.apto_texto || '—')} · ${auto || 'ainda sem auto'}</p>
      ${estado.permissoes.canEdit
        ? `<button data-retirar-abate="${idEquipamento}" class="mt-2 text-xs font-semibold text-red-600 hover:underline">Retirar a proposta</button>` : ''}
    </section>`;
  }
  // Um abate de antes dos autos ainda se anula, pela administração; um feito por
  // auto homologado não — o papel está assinado.
  const podeAnular = !ab.auto && estado.permissoes.canAdmin;
  return `<section class="bg-slate-100 border border-slate-200 rounded-lg p-4">
    <h3 class="text-sm font-bold text-slate-700 mb-1">Abatido${ab.data_abate ? ' em ' + dataPt(ab.data_abate) : ''}</h3>
    <p class="text-sm text-slate-600">${auto || esc(ab.motivo || 'sem motivo registado')}</p>
    ${auto && ab.motivo && !/^Auto de abate/.test(ab.motivo) ? `<p class="text-xs text-slate-500 mt-1">${esc(ab.motivo)}</p>` : ''}
    ${podeAnular ? `<button data-retirar-abate="${idEquipamento}" class="mt-2 text-xs font-semibold text-red-600 hover:underline">Anular abate</button>` : ''}
  </section>`;
}

function modalProporAbate(id) {
  abrirModal({
    titulo: 'Propor para abate',
    ajuda: 'Fica marcado até entrar num auto de abate e o auto ser homologado. Até lá não conta como abatido, e não se entrega.',
    campos: [
      { nome: 'motivo', rotulo: 'Motivo', tipo: 'text', obrigatorio: true, dica: 'Inoperacional, obsoleto, extraviado…' },
      { nome: 'apto_doacao', rotulo: 'Apto para doação', tipo: 'select', valor: 'nao', opcoes: [
        { valor: 'nao', texto: 'Não' },
        { valor: 'sim', texto: 'Sim' },
      ] },
      { nome: 'caracteristicas', rotulo: 'Características técnicas', tipo: 'text',
        dica: 'Só se for apto para doação', nota: 'Vai para a coluna "Apto para doação" do auto.' },
      { nome: 'obs', rotulo: 'Observações', tipo: 'textarea' },
    ],
    textoGravar: 'Propor',
    gravar: async d => {
      await enviar(`/${id}/abate`, d);
      toast('Proposto para abate.');
      await refrescar(painelAberto() ? id : null);
    },
  });
}

async function retirarAbate(id) {
  if (!confirm('Retirar a proposta (ou anular o abate) e devolver o equipamento ao parque?')) return;
  await pedir(`/${id}/abate`, { method: 'DELETE' });
  toast('Feito.');
  await refrescar(id);
}

/**
 * A janela do auto: o que o modelo da DMSI pede, por esta ordem. Num auto novo a
 * comissão e a entidade vêm do último (costumam ser as mesmas), e o n.º vem
 * sugerido — mas é o do papel que conta, e corrige-se aqui.
 */
function camposAuto(a) {
  return [
    { nome: 'numero', rotulo: 'N.º do auto de abate', tipo: 'number', valor: a.numero, obrigatorio: true,
      nota: a.sugerido ? `Sugerido: o seguinte ao último lançado em ${a.ano}. Escreva o do papel, se for outro.`
                       : 'O ano é o da data do auto.' },
    { nome: 'data', rotulo: 'Data da reunião da comissão', tipo: 'date', valor: a.data ? String(a.data).slice(0, 10) : hojeISO() },
    { nome: 'comissao1', rotulo: 'Comissão — 1.º elemento', tipo: 'text', valor: a.comissao1, dica: 'Chefe Hélio Marques', obrigatorio: true },
    { nome: 'comissao2', rotulo: 'Comissão — 2.º elemento', tipo: 'text', valor: a.comissao2 },
    { nome: 'comissao3', rotulo: 'Comissão — 3.º elemento', tipo: 'text', valor: a.comissao3 },
    { nome: 'valor', rotulo: 'Valor do auto', tipo: 'text', valor: a.valor,
      nota: 'Vazio, e com mais de 10 equipamentos, fica "Em anexo a lista…".' },
    { nome: 'destino', rotulo: 'Entidade responsável pelo equipamento a abater', tipo: 'text',
      valor: a.destino || DESTINO_HABITUAL, obrigatorio: true,
      nota: 'É o "abatendo-os à responsabilidade de" do auto.' },
    { nome: 'obs', rotulo: 'Observações (não vão para o papel)', tipo: 'textarea', valor: a.obs },

}

function modalNovoAuto() {
  const ultimo = (estado.autos || [])[0] || {};
  abrirModal({
    titulo: 'Novo auto de abate',
    ajuda: 'Junta todos os propostos desta página que ainda não estão num auto.',
    campos: camposAuto({ numero: (estado.proximoAuto || {}).numero, ano: (estado.proximoAuto || {}).ano, sugerido: true,
                         comissao1: ultimo.comissao1, comissao2: ultimo.comissao2,
                         comissao3: ultimo.comissao3, destino: ultimo.destino }),
    textoGravar: 'Criar o auto',
    gravar: async d => {
      const r = await enviar('/autos', d);
      toast(`Auto de abate n.º ${r.numero_texto} criado.`);
      await refrescar(null);
      await abrirAuto(r.id);
    },
  });
}

function modalEditarAuto() {
  const a = estado.autoAberto;
  abrirModal({
    titulo: `Editar o Auto n.º ${a.numero_texto}`,
    campos: camposAuto(a),
    gravar: async d => {
      await enviar(`/autos/${a.id}`, d, 'PUT');
      toast('Auto gravado.');
      await abrirAuto(a.id);
    },
  });
}

async function accaoAuto(alvo) {
  const a = estado.autoAberto;
  if (alvo.matches('[data-autos]')) return abrirAutos();
  if (alvo.matches('[data-auto-novo]')) return modalNovoAuto();
  if (alvo.matches('[data-auto]')) return abrirAuto(Number(alvo.dataset.auto));
  if (alvo.matches('[data-auto-editar]')) return modalEditarAuto();
  if (alvo.matches('[data-auto-acrescentar]')) {
    const r = await enviar(`/autos/${a.id}/acrescentar`, {});
    toast(r.acrescentados ? `Juntados ${r.acrescentados}.` : 'Não havia propostos novos.', r.acrescentados ? undefined : 'aviso');
    return abrirAuto(a.id);
  }
  if (alvo.matches('[data-auto-tirar]')) {
    await pedir(`/autos/${a.id}/itens/${alvo.dataset.autoTirar}`, { method: 'DELETE' });
    toast('Saiu do auto; continua proposto.');
    return abrirAuto(a.id);
  }
  if (alvo.matches('[data-auto-homologar]')) {
    if (!confirm(`Homologar o Auto n.º ${a.numero_texto}? Os ${a.itens.length} equipamentos ficam abatidos a ${dataPt(a.data)}, e isto não se desfaz.`)) return;
    const r = await enviar(`/autos/${a.id}/homologar`, {});
    toast(`Auto homologado: ${r.abatidos} abatidos.`);
    await refrescar(null);
    return abrirAuto(a.id);
  }
  if (alvo.matches('[data-auto-apagar]')) {
    if (!confirm(`Apagar o Auto n.º ${a.numero_texto}? Os equipamentos continuam propostos, e o n.º fica livre.`)) return;
    await pedir(`/autos/${a.id}`, { method: 'DELETE' });
    toast('Auto apagado.');
    return abrirAutos();
  }
}

document.addEventListener('click', async ev => {
  const alvo = ev.target.closest('[data-propor],[data-retirar-abate],#btnAutos,[data-autos],[data-auto-novo],[data-auto],[data-auto-editar],[data-auto-acrescentar],[data-auto-tirar],[data-auto-homologar],[data-auto-apagar]');
  if (!alvo) return;
  ev.stopPropagation();
  try {
    if (alvo.matches('[data-propor]')) return modalProporAbate(Number(alvo.dataset.propor));
    if (alvo.matches('[data-retirar-abate]')) return await retirarAbate(Number(alvo.dataset.retirarAbate));
    if (alvo.id === 'btnAutos') return await abrirAutos();
    await accaoAuto(alvo);
  } catch (err) {
    toast(err.message, 'erro');
  }
}, true);

// ─── Arranque ──────────────────────────────────────────────

/**
 * O ecrã de paragem — o mesmo das outras páginas e do `iga.html`.
 *
 * A `conta` existe porque quem cá chega sem acesso vai ter de pedir a alguém que
 * lho dê, e a primeira coisa que lhe perguntam do outro lado é "qual é a conta?".
 * O `#app` esconde-se por baixo: a cortina é opaca, mas sem isto a página ficava
 * toda navegável pelo Tab por trás dela.
 */
function mostrarErro(titulo, detalhe, conta) {
  document.getElementById('erroTitulo').textContent = titulo;
  document.getElementById('erroDetalhe').textContent = detalhe || '';
  const linhaConta = document.getElementById('erroConta');
  linhaConta.innerHTML = conta
    ? `Indique esta conta ao pedir o acesso:<span class="block mt-1 font-mono text-sm font-bold text-slate-900 select-all">${esc(conta)}</span>`
    : '';
  linhaConta.classList.toggle('hidden', !conta);
  document.getElementById('app').classList.add('hidden');
  // O atalho "Saltar para o conteúdo" vive fora do #app: sem isto ficava a ser o
  // único elemento tabulável com a cortina em cima, e a saltar para o que ela
  // acabou de esconder.
  const atalho = document.querySelector('a[href="#conteudo"]');
  if (atalho) atalho.hidden = true;
  document.getElementById('ecraErro').classList.remove('hidden');
}

async function arrancar() {
  try {
    estado.permissoes = await pedir('/permissoes', null, API_MODULO);
  } catch (err) {
    console.error('[iga] /permissoes falhou:', (err && err.message) || err);
    return mostrarErro('Não foi possível confirmar as permissões.',
      'Volte a carregar a página. Se o problema se mantiver, contacte o NSIC.');
  }
  if (!estado.permissoes.username) {
    return mostrarErro('Não foi possível identificar a sua conta.',
      'O acesso ao inventário é dado à conta de domínio, e esta sessão não trouxe nenhuma. '
      + 'Volte a carregar a página; se o problema se mantiver, contacte o NSIC.');
  }
  if (!estado.permissoes.canView) {
    return mostrarErro('Acesso reservado ao Inventário e Gestão de Ativos.',
      'O acesso é dado por grupo. Solicite ao NSIC a inclusão no grupo "IGA" '
      + '(registo e consulta) ou "IGA-Consulta" (apenas consulta).',
      estado.permissoes.username);
  }

  // O tipo vem no URL. Sem ele, ou com um que não existe, não há página para
  // mostrar: os tipos abrem-se pelos cartões da entrada.
  try {
    if (!CODIGO) throw new Error('sem tipo no endereço');
    estado.tipo = await pedir('/tipos/' + encodeURIComponent(CODIGO), null, API_MODULO);
  } catch (err) {
    console.error('[iga] tipo não lido:', (err && err.message) || err);
    return mostrarErro('Tipo de equipamento não encontrado.',
      'Este endereço não corresponde a nenhum tipo de equipamento. Volte ao início (/iga.html) e escolha um cartão.');
  }

  document.title = `${estado.tipo.nome} · IGA`;
  document.getElementById('nomeUtilizador').textContent =
    estado.permissoes.nome || estado.permissoes.username || '—';
  document.getElementById('etiquetaAcesso').textContent =
    estado.permissoes.canAdmin ? 'Administração' : estado.permissoes.canEdit ? 'Escrita' : 'Só consulta';
  if (estado.permissoes.canEdit) document.getElementById('btnNovo').classList.remove('hidden');
  if (estado.permissoes.canAdmin) {
    const ligacao = document.getElementById('ligacaoCampos');
    ligacao.href = '/tipos.html?tipo=' + encodeURIComponent(CODIGO);
    ligacao.classList.remove('hidden');
  }

  desenharKpis();
  desenharFiltros();
  try {
    await Promise.all([carregarEstatisticas(), carregar(), carregarLocais()]);
  } catch (err) {
    toast(err.message, 'erro');
  }
  if (window.lucide) lucide.createIcons();
}

arrancar();
</script>
</body>
</html>
